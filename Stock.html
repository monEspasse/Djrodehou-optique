    function rechercheReferenceInventaire() {
        const term = (document.getElementById('invSearchRef')?.value || '').toLowerCase().trim();
        const resultsBox = document.getElementById('invSearchResults');
        if (!resultsBox) return;

        if (!term) {
            resultsBox.style.display = 'none';
            resultsBox.innerHTML = '';
            return;
        }

        const produits = STATE.inventaireEnCours?.produits || [];
        const dejaAjoutes = new Set((STATE.inventaireEnCours?.items || []).map(i => i.reference));

        const matches = produits.filter(p => {
            const ref = (p['Référence'] || '').toString().toLowerCase();
            const desc = (p['Désignation'] || '').toString().toLowerCase();
            return ref.includes(term) || desc.includes(term);
        }).slice(0, 20);

        if (!matches.length) {
            resultsBox.innerHTML = `<div style="padding:.6rem .8rem;color:var(--text-subtle);font-size:.82rem;">Aucun résultat</div>`;
            resultsBox.style.display = 'block';
            return;
        }

        resultsBox.innerHTML = matches.map(p => {
            const ref = p['Référence'] || '';
            const stock = p['Stock Physique'] ?? p['Stock'] ?? 0;
            const already = dejaAjoutes.has(ref);
            return `<div style="padding:.55rem .8rem;cursor:${already ? 'not-allowed' : 'pointer'};font-size:.82rem;border-bottom:1px solid var(--border);opacity:${already ? '.5' : '1'};display:flex;justify-content:space-between;gap:.5rem;"
                         ${already ? '' : `onmouseover="this.style.background='var(--brand-50)'" onmouseout="this.style.background=''" onclick="selectionnerReferenceInventaire('${Utils.escapeHtml(ref)}')"`}>
                        <span><strong>${Utils.escapeHtml(ref)}</strong>${p['Désignation'] ? ' — ' + Utils.escapeHtml(p['Désignation']) : ''}</span>
                        <span style="color:var(--text-subtle);">${already ? 'déjà ajouté' : 'stock: ' + stock}</span>
                    </div>`;
        }).join('');
        resultsBox.style.display = 'block';
    }

    function selectionnerReferenceInventaire(reference) {
        const produits = STATE.inventaireEnCours?.produits || [];
        const produit = produits.find(p => (p['Référence'] || '') === reference);
        if (!produit) return;

        const stockActuel = produit['Stock Physique'] ?? produit['Stock'] ?? 0;

        STATE.inventaireEnCours.selection = {
            reference,
            categorie: produit['Catégorie'] || '',
            prix: produit['Prix de vente'] || 0,
            stockDepart: produit['Stock de depart'] ?? produit['Stock depart'] ?? 0,
            stockActuel
        };

        document.getElementById('invSelRef').value = reference;
        document.getElementById('invSelStockActuel').value = stockActuel;
        document.getElementById('invSelNouvelleQte').value = '';
        document.getElementById('invSelectedForm').style.display = 'flex';

        document.getElementById('invSearchResults').style.display = 'none';
        document.getElementById('invSearchRef').value = '';

        setTimeout(() => document.getElementById('invSelNouvelleQte')?.focus(), 100);
    }

    function ajouterReferenceInventaire() {
        const sel = STATE.inventaireEnCours?.selection;
        if (!sel) {
            Utils.showInlineMessage('inventaire-message', "Sélectionnez d'abord une référence", 'warning');
            return;
        }
        const nouvelleQteInput = document.getElementById('invSelNouvelleQte');
        const nouvelleQte = parseInt(nouvelleQteInput?.value);
        if (isNaN(nouvelleQte) || nouvelleQte < 0) {
            Utils.showInlineMessage('inventaire-message', 'Veuillez saisir une quantité valide', 'error');
            return;
        }

        STATE.inventaireEnCours.items = STATE.inventaireEnCours.items.filter(i => i.reference !== sel.reference);
        STATE.inventaireEnCours.items.push({
            reference: sel.reference,
            categorie: sel.categorie,
            prix: sel.prix,
            stockDepart: sel.stockDepart,
            ancienneQuantite: sel.stockActuel,
            nouvelleQuantite: nouvelleQte
        });

        STATE.inventaireEnCours.selection = null;
        document.getElementById('invSelectedForm').style.display = 'none';

        renderListeInventaireItems();
        Utils.showToast(`${sel.reference} ajouté`, 'success', 1500);
        setTimeout(() => document.getElementById('invSearchRef')?.focus(), 100);
    }

    function supprimerReferenceInventaire(reference) {
        if (!STATE.inventaireEnCours) return;
        STATE.inventaireEnCours.items = STATE.inventaireEnCours.items.filter(i => i.reference !== reference);
        renderListeInventaireItems();
    }

    function renderListeInventaireItems() {
        const items = STATE.inventaireEnCours?.items || [];
        const tbody = document.getElementById('invListeItems');
        const compteur = document.getElementById('invCompteur');
        if (compteur) compteur.textContent = `${items.length} référence(s) à mettre à jour`;
        if (!tbody) return;

        if (!items.length) {
            tbody.innerHTML = `<tr><td colspan="5"><div class="no-data">Aucune référence ajoutée pour le moment</div></td></tr>`;
            return;
        }

        tbody.innerHTML = items.map(it => `
            <tr>
                <td>${Utils.escapeHtml(it.reference)}</td>
                <td>${Utils.escapeHtml(it.categorie)}</td>
                <td class="text-end">${it.ancienneQuantite}</td>
                <td class="text-end"><strong>${it.nouvelleQuantite}</strong></td>
                <td class="text-center">
                    <button class="btn btn-danger" style="padding:.25rem .5rem;font-size:.7rem;" onclick="supprimerReferenceInventaire('${Utils.escapeHtml(it.reference)}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function validerMiseAJourInventaire() {
        if (!TokenManager.checkAndRedirect()) return;

        const agenceId = STATE.inventaireEnCours?.agenceId;
        const items = STATE.inventaireEnCours?.items || [];
        const agency = STATE.agencies.find(a => a.value === agenceId);

        if (!items.length) {
            Utils.showInlineMessage('inventaire-message', 'Aucune référence à mettre à jour', 'warning');
            return;
        }
        if (!confirm(`${items.length} référence(s) à mettre à jour ?`)) return;

        const modifications = items.map(it => ({
            reference: it.reference,
            categorie: it.categorie,
            agence: agency?.label || agenceId,
            prix: it.prix,
            nouvelleQuantite: it.nouvelleQuantite,
            ancienneQuantite: it.ancienneQuantite
        }));

        const btn = document.getElementById('btnValiderInventaire');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        Utils.showProgress('Mise à jour...');

        try {
            await API.post('inventaire', {
                action: 'inventaire',
                agence: agency?.label || agenceId,
                modifications,
                timestamp: new Date().toISOString()
            });

            Utils.hideProgress(true, 'Inventaire mis à jour');
            Utils.showInlineMessage('inventaire-message', `✅ ${modifications.length} référence(s) mise(s) à jour`, 'success');
            setTimeout(() => {
                Utils.closeModal();
                STATE.inventaireEnCours = null;
                refreshStockData(agenceId);
            }, 1500);
        } catch {
            Utils.hideProgress(false, 'Erreur');
            Utils.showInlineMessage('inventaire-message', '❌ Erreur de connexion', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Valider la mise à jour';
        }
    }

    function addProductRow() {
        const container = document.getElementById('product-rows-container');
        const rows = container.querySelectorAll('.product-row');
        const newRowNum = rows.length + 1;

        const firstRow = rows[0];
        const newRow = firstRow.cloneNode(true);

        newRow.dataset.row = newRowNum;
        newRow.querySelectorAll('[data-row]').forEach(el => el.dataset.row = newRowNum);

        const select = newRow.querySelector('.product-select');
        const qty = newRow.querySelector('.product-qty');

        select.innerHTML = document.querySelector('.product-select').innerHTML;
        select.value = '';
        select.onchange = function() { updateProductRowInfo(this); };

        qty.value = 1;
        qty.removeAttribute('max');
        qty.oninput = function() { clampProductQty(this); };

        container.appendChild(newRow);
        refreshProductOptionsAvailability();
        updateTransferSummary();
        setTimeout(() => select.focus(), 100);
    }

    function removeProductRow(btn) {
        const container = document.getElementById('product-rows-container');
        const rows = container.querySelectorAll('.product-row');
        if (rows.length <= 1) {
            Utils.showInlineMessage('transfer-message', 'Au moins un produit est requis', 'warning');
            return;
        }
        const row = btn.closest('.product-row');
        row.remove();
        document.querySelectorAll('.product-row').forEach((r, i) => {
            r.dataset.row = i + 1;
            r.querySelectorAll('[data-row]').forEach(el => el.dataset.row = i + 1);
        });
        refreshProductOptionsAvailability();
        updateTransferSummary();
    }

    function refreshProductOptionsAvailability() {
        const selects = document.querySelectorAll('.product-select');
        const selectedRefs = Array.from(selects).map(s => s.value).filter(v => v);

        selects.forEach(select => {
            const currentValue = select.value;
            Array.from(select.options).forEach(opt => {
                if (!opt.value) return;
                const takenByAnotherRow = selectedRefs.includes(opt.value) && opt.value !== currentValue;
                opt.disabled = takenByAnotherRow;
                opt.style.color = takenByAnotherRow ? 'var(--text-subtle)' : '';
            });
        });
    }

    function clampProductQty(input) {
        const row = input.closest('.product-row');
        const select = row.querySelector('.product-select');
        const maxStock = parseInt(select.options[select.selectedIndex]?.dataset?.stock) || 0;

        if (maxStock > 0) {
            if (!input.value || parseInt(input.value) < 1) {
                input.value = 1;
            } else if (parseInt(input.value) > maxStock) {
                input.value = maxStock;
                Utils.showInlineMessage('transfer-message', `Quantité limitée au stock disponible (max: ${maxStock})`, 'warning');
            }
        }
        updateTransferSummary();
    }

    function updateProductRowInfo(select) {
        const qtyInput = select.closest('.product-row').querySelector('.product-qty');
        const maxStock = parseInt(select.options[select.selectedIndex]?.dataset?.stock) || 0;

        if (qtyInput) {
            if (maxStock > 0) {
                qtyInput.max = maxStock;
                if (!qtyInput.value || parseInt(qtyInput.value) < 1) qtyInput.value = 1;
                if (parseInt(qtyInput.value) > maxStock) qtyInput.value = maxStock;
            } else {
                qtyInput.removeAttribute('max');
            }
        }

        refreshProductOptionsAvailability();
        updateTransferSummary();
    }

    function updateTransferSummary() {
        const rows = document.querySelectorAll('.product-row');
        let count = 0;
        let totalQty = 0;

        rows.forEach(row => {
            const select = row.querySelector('.product-select');
            const qty = parseInt(row.querySelector('.product-qty')?.value) || 0;
            if (select && select.value) {
                count++;
                totalQty += qty;
            }
        });

        const countEl = document.getElementById('product-count');
        const badgeEl = document.getElementById('total-items-badge');
        if (countEl) countEl.textContent = count;
        if (badgeEl) badgeEl.textContent = `${totalQty} unité${totalQty > 1 ? 's' : ''}`;
    }

    async function submitTransferRequest(sourceAgenceId) {
        if (!TokenManager.checkAndRedirect()) return;

        const products = [];
        const rows = document.querySelectorAll('.product-row');
        const refsSeen = new Set();
        let hasError = false;

        rows.forEach(row => {
            const select = row.querySelector('.product-select');
            const qty = parseInt(row.querySelector('.product-qty')?.value) || 0;

            if (select && select.value) {
                if (refsSeen.has(select.value)) {
                    Utils.showInlineMessage('transfer-message', `La référence "${select.value}" est sélectionnée plusieurs fois`, 'error');
                    hasError = true;
                    return;
                }
                refsSeen.add(select.value);

                const stock = parseInt(select.options[select.selectedIndex]?.dataset?.stock) || 0;
                if (qty <= 0) {
                    Utils.showInlineMessage('transfer-message', `Quantité invalide pour ${select.value}`, 'error');
                    hasError = true;
                    return;
                }
                if (qty > stock) {
                    Utils.showInlineMessage('transfer-message', `Stock insuffisant pour ${select.value} (max: ${stock})`, 'error');
                    hasError = true;
                    return;
                }
                products.push({
                    reference: select.value,
                    quantite: qty,
                    categorie: select.options[select.selectedIndex]?.dataset?.categorie || '',
                    prix: parseFloat(select.options[select.selectedIndex]?.dataset?.prix) || 0,
                    stock_actuel: stock
                });
            }
        });

        if (hasError) return;

        if (products.length === 0) {
            Utils.showInlineMessage('transfer-message', 'Veuillez sélectionner au moins un produit', 'warning');
            return;
        }

        const targetAgencyId = document.getElementById('transfer-target-agency')?.value;
        if (!targetAgencyId) {
            Utils.showInlineMessage('transfer-message', 'Veuillez sélectionner une agence de destination', 'warning');
            return;
        }

        const sourceAgency = STATE.agencies.find(a => a.value === sourceAgenceId);
        const targetAgency = STATE.agencies.find(a => a.value === targetAgencyId);

        const btn = document.getElementById('btnSubmitTransfer');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';

        Utils.showProgress('Préparation du transfert...');

        try {
            await API.post('transfert_request', {
                source_agence: sourceAgency?.label || sourceAgenceId,
                target_agence: targetAgency?.label || targetAgencyId,
                source_agence_id: sourceAgenceId,
                target_agence_id: targetAgencyId,
                produits: products,
                utilisateur: TokenManager.getUser(),
                total_produits: products.length,
                quantite_totale: products.reduce((sum, p) => sum + p.quantite, 0)
            });

            Utils.hideProgress(true, 'Demande envoyée');

            STATE.pendingTransferData = {
                sourceAgenceId: sourceAgenceId,
                targetAgencyId: targetAgencyId,
                produits: products,
                sourceAgency: sourceAgency,
                targetAgency: targetAgency
            };

            Utils.showInlineMessage('transfer-message', '✅ Demande envoyée ! Un code de validation a été envoyé par email.', 'success');

            setTimeout(() => {
                const modal = document.getElementById('transferWizardModal');
                if (modal) {
                    modal.classList.remove('active');
                    setTimeout(() => modal.remove(), 300);
                }
                openTransferCodeVerification();
            }, 1500);

        } catch (error) {
            Utils.hideProgress(false, 'Erreur');
            Utils.showInlineMessage('transfer-message', '❌ Erreur: ' + (error.message || 'Connexion échouée'), 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Demander le transfert';
        }
    }

    async function validateTransferCode() {
        const code = document.getElementById('transferCodeInput')?.value.trim();
        if (!code || code.length !== 6) {
            Utils.showInlineMessage('transferCodeMessage', 'Veuillez saisir un code à 6 chiffres', 'error');
            return;
        }

        const btn = document.getElementById('btnValidateTransferCode');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Vérification...';

        try {
            const result = await API.get('codeaccess', { code: code });
            if (!result || result.success !== true) {
                throw new Error(result?.message || 'Code incorrect');
            }

            Utils.showInlineMessage('transferCodeMessage', '✅ Code validé ! Transfert en cours...', 'success');

            if (!STATE.pendingTransferData) {
                throw new Error('Données de transfert manquantes. Veuillez recommencer.');
            }

            const { sourceAgenceId, targetAgencyId, produits, sourceAgency, targetAgency } = STATE.pendingTransferData;

            Utils.showProgress('Transfert en cours...');

            let successCount = 0;
            for (const produit of produits) {
                try {
                    await API.post('transfert_stock', {
                        source_agence: sourceAgency?.label || sourceAgenceId,
                        target_agence: targetAgency?.label || targetAgencyId,
                        reference: produit.reference,
                        categorie: produit.categorie,
                        quantite: produit.quantite,
                        prix: produit.prix,
                        utilisateur: TokenManager.getUser()
                    });
                    successCount++;
                } catch (err) {
                    console.error(`Erreur transfert ${produit.reference}:`, err);
                    Utils.showToast(`Erreur pour ${produit.reference}`, 'error', 2000);
                }
            }

            Utils.hideProgress(true, `${successCount} produit(s) transféré(s)`);

            if (successCount === produits.length) {
                Utils.showInlineMessage('transferCodeMessage', `✅ Transfert terminé ! ${successCount} produit(s) transféré(s).`, 'success');
                Utils.showToast(`✅ ${successCount} produit(s) transféré(s) avec succès`, 'success', 3000);
            } else {
                Utils.showInlineMessage('transferCodeMessage', `⚠️ ${successCount}/${produits.length} produit(s) transféré(s). Vérifiez les erreurs.`, 'warning');
            }

            setTimeout(() => {
                Utils.closeModal();
                STATE.pendingTransferData = null;
                refreshStockData(sourceAgenceId);
                if (targetAgencyId) refreshStockData(targetAgencyId);
            }, 1500);

        } catch (error) {
            Utils.hideProgress(false, 'Erreur');
            Utils.showInlineMessage('transferCodeMessage', '❌ Code invalide ou erreur: ' + (error.message || 'Vérification échouée'), 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Valider et transférer';
        }
    }

    // ============================================================
    // INITIALISATION
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        if (!TokenManager.checkAndRedirect()) return;

        initTheme();
        initSidebar();

        const username = TokenManager.getUser();

        // Sidebar user
        const userNameSidebar = document.getElementById('username-display-sidebar');
        if (userNameSidebar) userNameSidebar.textContent = username;
        const profileImg = document.getElementById('profile-img');
        if (profileImg) profileImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=4f46e5&color=fff&bold=true`;

        // Bind logout
        const lb = document.getElementById('logout-btn');
        if (lb && !lb.dataset.bound) {
            lb.dataset.bound = '1';
            lb.addEventListener('click', handleLogout);
        }

        updateCurrentDate();
        window.addEventListener('scroll', handleScroll);
        loadAgencies();
    });

    // Exposer les fonctions globalement
    window.showSection = showSection;
    window.goBack = goBack;
    window.closeToast = closeToast;
    window.sortTable = sortTable;
    window.applyStockFilter = applyStockFilter;
    window.refreshStockData = refreshStockData;
    window.demarrerInventaire = demarrerInventaire;
    window.regenererCode = regenererCode;
    window.verifierCodeAcces = verifierCodeAcces;
    window.validerMiseAJourInventaire = validerMiseAJourInventaire;
    window.imprimerInventairePDF = imprimerInventairePDF;
    window.openTransferWizard = openTransferWizard;
    window.addProductRow = addProductRow;
    window.removeProductRow = removeProductRow;
    window.updateProductRowInfo = updateProductRowInfo;
    window.submitTransferRequest = submitTransferRequest;
    window.validateTransferCode = validateTransferCode;
    window.toggleCategoryFilter = toggleCategoryFilter;
    window.selectCategoryFilter = selectCategoryFilter;
    window.Utils = Utils;
    window.TokenManager = TokenManager;
    window.loadAgencies = loadAgencies;
    window.openCategorieInventaireDialog = openCategorieInventaireDialog;
    window.confirmerCategorieInventaire = confirmerCategorieInventaire;
    window.openQuestionMiseAJourDialog = openQuestionMiseAJourDialog;
    window.openInventaireSearchModal = openInventaireSearchModal;
    window.rechercheReferenceInventaire = rechercheReferenceInventaire;
    window.selectionnerReferenceInventaire = selectionnerReferenceInventaire;
    window.ajouterReferenceInventaire = ajouterReferenceInventaire;
    window.supprimerReferenceInventaire = supprimerReferenceInventaire;
    window.clampProductQty = clampProductQty;
    window.refreshProductOptionsAvailability = refreshProductOptionsAvailability;
    window.toggleNavSub = toggleNavSub;
    window.selectStockAgencyFromSidebar = selectStockAgencyFromSidebar;
</script>
