<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4361ee">
    <title>VisioPro</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
/* ============================================================
   1. DESIGN TOKENS (repris du dashboard VisioPro)
   ============================================================ */
:root {
    --brand-50: #eef2ff; --brand-100: #e0e7ff; --brand-200: #c7d2fe;
    --brand-300: #a5b4fc; --brand-400: #818cf8; --brand-500: #6366f1;
    --brand-600: #4f46e5; --brand-700: #4338ca; --brand-800: #3730a3; --brand-900: #312e81;

    --n-0: #ffffff; --n-50: #f8fafc; --n-100: #f1f5f9; --n-200: #e2e8f0;
    --n-300: #cbd5e1; --n-400: #94a3b8; --n-500: #64748b; --n-600: #475569;
    --n-700: #334155; --n-800: #1e293b; --n-900: #0f172a; --n-950: #020617;

    --success: #10b981; --success-bg: #d1fae5;
    --warning: #f59e0b; --warning-bg: #fef3c7;
    --danger:  #ef4444; --danger-bg:  #fee2e2;
    --info:    #3b82f6; --info-bg:    #dbeafe;

    --violet: #8b5cf6; --pink: #ec4899; --cyan: #06b6d4;

    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;

    --sh-xs: 0 1px 2px rgba(15,23,42,.05);
    --sh-sm: 0 2px 4px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --sh-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --sh-lg: 0 12px 24px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.05);
    --sh-xl: 0 24px 48px rgba(15,23,42,.14), 0 8px 16px rgba(15,23,42,.06);
    --sh-brand: 0 8px 24px rgba(79,70,229,.25);
    --sh-brand-lg: 0 20px 45px rgba(79,70,229,.35);

    --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --r-xl: 20px; --r-2xl: 24px; --r-3xl: 32px; --r-full: 9999px;

    --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem;
    --s-5: 1.25rem; --s-6: 1.5rem; --s-8: 2rem; --s-10: 2.5rem;

    --ease: cubic-bezier(.4,0,.2,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --dur-fast: 150ms;
    --dur: 250ms;
    --dur-slow: 400ms;
}

/* ============================================================
   2. RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
}

img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }

:focus-visible {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
    border-radius: var(--r-xs);
}

/* ============================================================
   3. ARRIÈRE-PLAN DÉCORATIF (aligné sur le design system)
   ============================================================ */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 20%, rgba(99,102,241,.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(139,92,246,.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(236,72,153,.06) 0%, transparent 60%);
    z-index: -1;
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(99,102,241,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.04) 1px, transparent 1px);
    background-size: 48px 48px;
    z-index: -1;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}

        body {
            background: url("image.png") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

.floating-elements {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
}
.floating-element {
    position: absolute;
    background: linear-gradient(135deg, rgba(99,102,241,.10), rgba(139,92,246,.06));
    border-radius: 50%;
    animation: float 18s infinite ease-in-out;
    backdrop-filter: blur(2px);
}
.floating-element:nth-child(1) { width: 100px; height: 100px; top: 12%; left: 8%; animation-delay: 0s; }
.floating-element:nth-child(2) { width: 140px; height: 140px; top: 65%; left: 82%; animation-delay: -6s; }
.floating-element:nth-child(3) { width: 70px; height: 70px; top: 22%; left: 88%; animation-delay: -12s; }
.floating-element:nth-child(4) { width: 120px; height: 120px; top: 78%; left: 12%; animation-delay: -8s; }

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    33% { transform: translateY(-24px) rotate(120deg); }
    66% { transform: translateY(12px) rotate(240deg); }
}

/* ============================================================
   4. HEADER (logo)
   ============================================================ */
header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: var(--s-5) var(--s-6);
    margin-bottom: var(--s-6);
    position: relative;
    z-index: 10;
}
.logo-container {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    animation: logoPop .6s var(--ease-spring);
}
@keyframes logoPop {
    from { opacity: 0; transform: translateY(-12px) scale(.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.logo-container img {
    height: 44px;
    width: 44px;
    object-fit: contain;
    border-radius: var(--r-md);
}
.logo-container h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, var(--brand-600), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ============================================================
   5. CONTAINER DE LOGIN
   ============================================================ */
.login-container {
    width: 100%;
    max-width: 440px;
    margin: auto;
    padding: 0 var(--s-4);
    animation: fadeIn .6s var(--ease);
    position: relative;
    z-index: 10;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
}

.login-box {
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    padding: var(--s-10) var(--s-8);
    border-radius: var(--r-3xl);
    border: 1px solid var(--border);
    box-shadow: var(--sh-xl);
    position: relative;
    overflow: hidden;
    transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.login-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 32px 56px rgba(15,23,42,.16), 0 12px 20px rgba(15,23,42,.08);
}

/* Bande lumineuse décorative en haut */
.login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--brand-500), var(--violet), var(--pink), var(--brand-500));
    background-size: 300% 100%;
    animation: gradientShift 6s ease infinite;
}
@keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Halo lumineux subtil */
.login-box::after {
    content: '';
    position: absolute;
    top: -40%; right: -40%;
    width: 80%; height: 80%;
    background: radial-gradient(circle, rgba(99,102,241,.08) 0%, transparent 70%);
    pointer-events: none;
    border-radius: 50%;
}

/* Logo/lock icon */
.lock-icon-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto var(--s-5);
    border-radius: var(--r-xl);
    background: linear-gradient(135deg, var(--brand-500), var(--violet));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--sh-brand);
    overflow: hidden;
    position: relative;
    z-index: 2;
    transition: transform var(--dur) var(--ease-spring);
}
.lock-icon-wrap:hover { transform: rotate(-6deg) scale(1.05); }

.lock-icon-logo {
    width: 100%; height: 100%;
    object-fit: cover;
}
.lock-icon-wrap i {
    color: #fff;
    font-size: 1.8rem;
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%; height: 100%;
}

/* Titres */
h2 {
    text-align: center;
    color: var(--text);
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -.02em;
    margin-bottom: var(--s-2);
    position: relative;
    z-index: 2;
}
.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: .85rem;
    margin-bottom: var(--s-6);
    position: relative;
    z-index: 2;
}

/* ============================================================
   6. FORMULAIRE
   ============================================================ */
label {
    color: var(--text);
    font-size: .82rem;
    font-weight: 600;
    margin-bottom: var(--s-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.caps-lock-warning {
    color: var(--warning);
    font-size: .72rem;
    font-weight: 700;
    display: none;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--warning-bg);
    border-radius: var(--r-full);
}
.caps-lock-warning.visible { display: inline-flex; }

.input-group { margin-bottom: var(--s-4); }

.input-field {
    display: flex;
    align-items: center;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--r-lg);
    padding: 0 var(--s-4);
    transition: all var(--dur-fast) var(--ease);
    position: relative;
    overflow: hidden;
}
.input-field::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,.08), transparent);
    transition: left .6s ease;
    pointer-events: none;
}
.input-field:focus-within::before { left: 100%; }

.input-field.field-error {
    border-color: var(--danger);
    background: var(--danger-bg);
    box-shadow: 0 0 0 3px rgba(239,68,68,.12);
}
.input-field.field-valid {
    border-color: var(--success);
    background: var(--success-bg);
}

.input-field input {
    flex: 1;
    padding: var(--s-3) 0;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: .95rem;
    font-weight: 500;
    min-width: 0;
}
.input-field input::placeholder {
    color: var(--text-subtle);
    font-weight: 400;
}
.input-field i {
    color: var(--text-subtle);
    font-size: .95rem;
    margin-right: var(--s-3);
    transition: color var(--dur-fast) var(--ease);
    flex-shrink: 0;
}
.input-field:focus-within {
    border-color: var(--brand-400);
    background: var(--surface);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-500) 15%, transparent);
    transform: translateY(-1px);
}
.input-field:focus-within i:first-child { color: var(--brand-500); }

.toggle-password {
    cursor: pointer;
    transition: color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
    padding: var(--s-1);
    margin-right: calc(-1 * var(--s-2)) !important;
}
.toggle-password:hover { color: var(--brand-500); transform: scale(1.15); }

/* Bouton de connexion */
.login-button {
    width: 100%;
    padding: var(--s-4);
    border-radius: var(--r-lg);
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: .95rem;
    letter-spacing: .01em;
    cursor: pointer;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
    background-size: 200% 200%;
    transition: all var(--dur) var(--ease-spring);
    position: relative;
    overflow: hidden;
    box-shadow: var(--sh-brand);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--s-2);
    margin-top: var(--s-2);
}
.login-button::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    transition: left .6s ease;
}
.login-button:hover::before { left: 100%; }
.login-button:hover:not(.disabled):not(.loading) {
    transform: translateY(-3px);
    box-shadow: var(--sh-brand-lg);
    background-position: 100% 100%;
}
.login-button:active:not(.disabled):not(.loading) {
    transform: translateY(-1px) scale(.99);
}
.login-button.disabled {
    opacity: .55;
    cursor: not-allowed;
    pointer-events: none;
    box-shadow: none;
}
.login-button.loading { pointer-events: none; }

/* ============================================================
   7. MESSAGES
   ============================================================ */
#message {
    margin-top: var(--s-4);
    padding: var(--s-3) var(--s-4);
    font-size: .85rem;
    font-weight: 500;
    border-radius: var(--r-md);
    text-align: center;
    display: none;
    animation: slideDown .3s var(--ease);
    line-height: 1.45;
}
@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}

.error-message {
    background: var(--danger-bg);
    color: #b91c1c;
    border: 1px solid #fecaca;
}
.success-message {
    background: var(--success-bg);
    color: #047857;
    border: 1px solid #a7f3d0;
}
.warning-message {
    background: var(--warning-bg);
    color: #92400e;
    border: 1px solid #fde68a;
}

/* ============================================================
   8. WELCOME MESSAGE
   ============================================================ */
.welcome-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 999;
    display: none;
    animation: overlayFade .3s ease-out;
}
@keyframes overlayFade { from { opacity: 0; } to { opacity: 1; } }

.welcome-message {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--surface);
    padding: var(--s-10) var(--s-12);
    border-radius: var(--r-3xl);
    box-shadow: var(--sh-xl);
    z-index: 1000;
    text-align: center;
    animation: fadeInScale .45s var(--ease-spring);
    display: none;
    border: 1px solid var(--border);
    min-width: 340px;
    max-width: 90vw;
}
@keyframes fadeInScale {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.85); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.welcome-message i {
    font-size: 56px;
    margin-bottom: var(--s-4);
    display: inline-block;
    background: linear-gradient(135deg, var(--brand-500), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: iconBounce .6s ease-out .15s both;
}
@keyframes iconBounce {
    0%   { transform: scale(.5); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
}

.welcome-message h3 {
    color: var(--text);
    font-size: 1.6rem;
    margin-bottom: var(--s-2);
    font-weight: 800;
    letter-spacing: -.02em;
}
.welcome-message p {
    color: var(--text-muted);
    font-size: .95rem;
}
.welcome-message .user-name {
    font-weight: 800;
    font-size: 1.25rem;
    margin-top: var(--s-2);
    background: linear-gradient(135deg, var(--brand-600), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.welcome-progress {
    margin-top: var(--s-5);
    width: 100%;
    height: 4px;
    background: var(--surface-3);
    border-radius: var(--r-full);
    overflow: hidden;
}
.welcome-progress-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--brand-500), var(--violet), var(--pink));
    background-size: 200% 100%;
    transform-origin: left;
    animation: shrinkBar 3s linear forwards;
    border-radius: var(--r-full);
}
@keyframes shrinkBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ============================================================
   9. COUNTDOWN TIMER
   ============================================================ */
.countdown-timer {
    font-size: .9rem;
    font-weight: 700;
    color: #92400e;
    margin-top: var(--s-3);
    text-align: center;
    background: var(--warning-bg);
    border: 1px solid #fde68a;
    padding: var(--s-3);
    border-radius: var(--r-md);
    animation: pulseWarning 1.5s ease-in-out infinite;
}
@keyframes pulseWarning {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.02); }
}

/* ============================================================
   10. FOOTER
   ============================================================ */
footer.page-footer {
    text-align: center;
    padding: var(--s-5) var(--s-4) var(--s-4);
    color: var(--text-subtle);
    font-size: .78rem;
    font-weight: 500;
    position: relative;
    z-index: 10;
}

/* ============================================================
   11. ANIMATIONS
   ============================================================ */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
    20%, 40%, 60%, 80% { transform: translateX(6px); }
}
.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97) both; }

input:disabled { opacity: .55; cursor: not-allowed; }

a:focus-visible, button:focus-visible, input:focus-visible, i.toggle-password:focus-visible {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* ============================================================
   12. RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
    header { padding: var(--s-4) var(--s-5); margin-bottom: var(--s-5); }
    .login-box { padding: var(--s-8) var(--s-6); border-radius: var(--r-2xl); }
    h2 { font-size: 1.4rem; }
    .welcome-message { padding: var(--s-8) var(--s-8); min-width: auto; width: 88%; }
    .welcome-message h3 { font-size: 1.35rem; }
    .welcome-message i { font-size: 46px; }
}

@media (max-width: 480px) {
    .logo-container h1 { font-size: 1.25rem; }
    .logo-container img { height: 36px; width: 36px; }
    .login-box { padding: var(--s-6) var(--s-5); border-radius: var(--r-xl); }
    h2 { font-size: 1.3rem; }
    .welcome-message { padding: var(--s-6) var(--s-6); }
    .welcome-message h3 { font-size: 1.2rem; }
    .lock-icon-wrap { width: 60px; height: 60px; }
    .lock-icon-wrap i { font-size: 1.5rem; }
}

/* Dark mode support */
html[data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111a2e;
    --surface-2: #0f172a;
    --surface-3: #1e293b;
    --border: #1e293b;
    --border-strong: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
}
    </style>
</head>

<body>
    <!-- Éléments décoratifs flottants -->
    <div class="floating-elements" aria-hidden="true">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <!-- Welcome overlay -->
    <div class="welcome-overlay" id="welcomeOverlay"></div>
    <div class="welcome-message" id="welcomeMessage" role="status" aria-live="polite">
        <i class="fas fa-user-circle"></i>
        <h3>Bonjour</h3>
        <div class="user-name" id="userNameDisplay"></div>
        <p>Bienvenue sur VisioPro</p>
        <div class="welcome-progress"><div class="welcome-progress-fill" id="welcomeProgressFill"></div></div>
    </div>

    <!-- Header -->

    <!-- Formulaire de connexion -->
    <div class="login-container">
        <div class="login-box">
    <header>
        <div class="logo-container">
            <img src="logoAppli.png" alt="VisioPro" onerror="this.style.display='none';">
            <h1>VisioPro</h1>
        </div>
    </header>

            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="username">Nom d'utilisateur</label>
                    <div class="input-field" id="usernameField">
                        <i class="fa fa-user" aria-hidden="true"></i>
                        <input type="text" id="username" placeholder="Entrez votre nom"
                               required autocomplete="username" aria-required="true">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <span>Mot de passe</span>
                        <span class="caps-lock-warning" id="capsLockWarning">
                            <i class="fas fa-triangle-exclamation"></i> Verr. Maj activé
                        </span>
                    </label>
                    <div class="input-field" id="passwordField">
                        <i class="fa fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" placeholder="Votre mot de passe"
                               required autocomplete="current-password" aria-required="true">
                        <i class="fa fa-eye toggle-password" id="togglePassword"
                           tabindex="0" role="button" aria-label="Afficher le mot de passe"></i>
                    </div>
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">Se connecter</span>
                </button>

                <div id="message" role="alert"></div>
                <div id="countdownDisplay" class="countdown-timer" style="display: none;"
                     role="status" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <footer class="page-footer">© VisioPro — Accès réservé au personnel autorisé</footer>

    <script>
        // ==================== CONFIGURATION ====================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4Fmu83Lmi9waQBLdHU1EEfVgQ14ceefh3PR-j5wQ1zsQ-KN5YYSLAQOy0Jjs1GEZ9/exec';

        // ==================== FONCTIONS DE SÉCURITÉ ====================

        function sanitizeInput(input) {
            if (!input) return '';
            return String(input)
                .replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                })
                .substring(0, 255);
        }

        function isValidUsername(username) {
            const validPattern = /^[a-zA-Z0-9_@.\-]{3,50}$/;
            return validPattern.test(username);
        }

        // ==================== GESTION DU TOKEN ====================

        function getApiToken() {
            return sessionStorage.getItem('apiToken');
        }

        function setApiToken(token) {
            if (token) sessionStorage.setItem('apiToken', token);
        }

        function clearApiToken() {
            sessionStorage.removeItem('apiToken');
            sessionStorage.removeItem('utilisateur');
            sessionStorage.removeItem('isAdmin');
            sessionStorage.removeItem('hasCaisseAccess');
            sessionStorage.removeItem('agence');
            sessionStorage.removeItem('analyse');
        }

        async function apiCall(action, data = {}) {
            const token = getApiToken();

            if (!token && action !== 'login') {
                console.error('❌ Pas de token, redirection vers login');
                window.location.href = 'index.html';
                throw new Error('Non authentifié');
            }

            const params = new URLSearchParams();
            params.append('action', action);
            if (token) params.append('token', token);

            for (const [key, value] of Object.entries(data)) {
                if (value !== undefined && value !== null) {
                    if (typeof value === 'object') {
                        params.append(key, JSON.stringify(value));
                    } else {
                        params.append(key, String(value));
                    }
                }
            }

            const url = `${SCRIPT_URL}?${params.toString()}`;
            const logUrl = url.replace(/password=[^&]*/, 'password=***');
            console.log(`📡 API Call (GET): ${action}`, logUrl);

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (!result.success && result.message && result.message.includes('Session')) {
                    console.warn('⚠️ Session expirée, redirection');
                    clearApiToken();
                    window.location.href = 'index.html';
                }

                return result;

            } catch (error) {
                console.error(`❌ Erreur API ${action}:`, error);
                return {
                    success: false,
                    message: 'Erreur de connexion au serveur',
                    errorDetails: error.message
                };
            }
        }

        // ==================== SYSTÈME DE BLOCAGE ====================

        const STORAGE_KEY = "visiopro_login_block";
        const MAX_ATTEMPTS = 3;
        const BLOCK_DURATION_MS = 60 * 1000;

        let blockData = null;
        let countdownInterval = null;

        function initBlockSystem() {
            const stored = localStorage.getItem(STORAGE_KEY);
            const now = Date.now();

            if (stored) {
                try {
                    blockData = JSON.parse(stored);
                    if (blockData.isBlocked) {
                        const remaining = blockData.blockedUntil - now;
                        if (remaining > 0) {
                            activateBlockade(remaining);
                            return;
                        } else {
                            resetBlockState();
                        }
                    } else {
                        const lastAttemptTime = blockData.lastAttemptTime || 0;
                        if (now - lastAttemptTime > 3600000) resetBlockState();
                    }
                } catch(e) { resetBlockState(); }
            } else {
                resetBlockState();
            }
        }

        function resetBlockState() {
            blockData = { attempts: 0, isBlocked: false, blockedUntil: null, lastAttemptTime: null };
            saveBlockState();
        }

        function saveBlockState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(blockData));
        }

        function registerFailedAttempt() {
            if (blockData.isBlocked) return false;
            blockData.attempts++;
            blockData.lastAttemptTime = Date.now();

            if (blockData.attempts >= MAX_ATTEMPTS) {
                blockData.isBlocked = true;
                blockData.blockedUntil = Date.now() + BLOCK_DURATION_MS;
                saveBlockState();
                activateBlockade(BLOCK_DURATION_MS);
                return true;
            }
            saveBlockState();
            return false;
        }

        function activateBlockade(remainingMs) {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');
            const countdownDiv = document.getElementById('countdownDisplay');

            usernameInput.disabled = true;
            passwordInput.disabled = true;
            loginBtn.disabled = true;
            loginBtn.classList.add('disabled');

            const secondsRemaining = Math.ceil(remainingMs / 1000);
            messageDiv.textContent = `⛔ Trop de tentatives échouées. Accès bloqué pour ${secondsRemaining} secondes.`;
            messageDiv.className = 'warning-message';
            messageDiv.style.display = 'block';
            countdownDiv.style.display = 'block';

            if (countdownInterval) clearInterval(countdownInterval);

            let remaining = remainingMs;
            countdownInterval = setInterval(() => {
                remaining -= 1000;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    resetBlockState();
                    deactivateBlockade();
                } else {
                    const secs = Math.ceil(remaining / 1000);
                    countdownDiv.textContent = `⏱️ Accès bloqué. Réessayez dans ${secs} secondes...`;
                }
            }, 1000);
        }

        function deactivateBlockade() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');
            const countdownDiv = document.getElementById('countdownDisplay');

            usernameInput.disabled = false;
            passwordInput.disabled = false;
            loginBtn.disabled = false;
            loginBtn.classList.remove('disabled');
            messageDiv.style.display = 'none';
            countdownDiv.style.display = 'none';

            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }

        function isAccessBlocked() {
            if (blockData && blockData.isBlocked) {
                if (Date.now() < blockData.blockedUntil) return true;
                resetBlockState();
                deactivateBlockade();
                return false;
            }
            return false;
        }

        // ==================== FONCTIONS PRINCIPALES ====================

        const form = document.getElementById('login-form');
        const message = document.getElementById('message');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInputField = document.getElementById('password');
        const usernameInputField = document.getElementById('username');
        const usernameFieldWrap = document.getElementById('usernameField');
        const passwordFieldWrap = document.getElementById('passwordField');
        const welcomeMessageDiv = document.getElementById('welcomeMessage');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const welcomeProgressFill = document.getElementById('welcomeProgressFill');
        const capsLockWarning = document.getElementById('capsLockWarning');

        function showWelcomeMessage(username) {
            const safeUsername = sanitizeInput(username);
            userNameDisplay.textContent = safeUsername;
            welcomeOverlay.style.display = 'block';
            welcomeMessageDiv.style.display = 'block';
            welcomeProgressFill.style.animation = 'none';
            void welcomeProgressFill.offsetWidth;
            welcomeProgressFill.style.animation = 'shrinkBar 3s linear forwards';

            setTimeout(() => {
                welcomeMessageDiv.style.animation = 'fadeInScale 0.3s reverse';
                setTimeout(() => {
                    welcomeMessageDiv.style.display = 'none';
                    welcomeOverlay.style.display = 'none';
                    welcomeMessageDiv.style.animation = '';
                }, 300);
            }, 3000);
        }

        if (togglePassword) {
            const togglePasswordVisibility = function() {
                const type = passwordInputField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInputField.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
                this.setAttribute('aria-label', type === 'password' ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
                passwordInputField.focus();
            };
            togglePassword.addEventListener('click', togglePasswordVisibility);
            togglePassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePasswordVisibility.call(this); }
            });
        }

        // Détection Verrouillage Majuscules
        passwordInputField.addEventListener('keyup', function(e) {
            if (typeof e.getModifierState === 'function') {
                const isCaps = e.getModifierState('CapsLock');
                capsLockWarning.classList.toggle('visible', isCaps);
            }
        });
        passwordInputField.addEventListener('blur', () => capsLockWarning.classList.remove('visible'));

        // Efface l'état d'erreur dès que l'utilisateur retape
        function clearFieldState(wrap) {
            wrap.classList.remove('field-error');
        }
        usernameInputField.addEventListener('input', () => {
            clearFieldState(usernameFieldWrap);
            if (message.style.display === 'block' && message.className.includes('error')) message.style.display = 'none';
        });
        passwordInputField.addEventListener('input', () => {
            clearFieldState(passwordFieldWrap);
            if (message.style.display === 'block' && message.className.includes('error')) message.style.display = 'none';
        });

        // Formulaire de connexion
        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (isAccessBlocked()) {
                    message.textContent = "⛔ Accès temporairement bloqué. Veuillez patienter.";
                    message.className = 'warning-message';
                    message.style.display = 'block';
                    return;
                }

                const username = sanitizeInput(usernameInputField.value.trim());
                const password = passwordInputField.value.trim();

                if (!username || !password) {
                    message.textContent = "Veuillez remplir tous les champs.";
                    message.className = 'error-message';
                    message.style.display = 'block';
                    if (!username) usernameFieldWrap.classList.add('field-error');
                    if (!password) passwordFieldWrap.classList.add('field-error');
                    form.classList.add('shake');
                    setTimeout(() => form.classList.remove('shake'), 450);
                    return;
                }

                if (!isValidUsername(username)) {
                    message.textContent = "Nom d'utilisateur invalide (3-50 caractères)";
                    message.className = 'error-message';
                    message.style.display = 'block';
                    usernameFieldWrap.classList.add('field-error');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                const loginBtnText = document.getElementById('loginBtnText');
                const originalBtnHTML = submitBtn.innerHTML;
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Connexion...</span>';
                submitBtn.disabled = true;
                message.style.display = 'none';

                try {
                    const result = await apiCall('login', {
                        username: username,
                        password: password
                    });

                    if (result.success && result.data && result.data.token) {
                        setApiToken(result.data.token);
                        sessionStorage.setItem("utilisateur", username);
                        sessionStorage.setItem("isAdmin", result.data.isAdmin ? "true" : "false");
                        sessionStorage.setItem("hasCaisseAccess", result.data.hasCaisseAccess ? "true" : "false");
                        sessionStorage.setItem("agence", result.data.agence || "");
                        sessionStorage.setItem("analyse", result.data.analyse || "");

                        resetBlockState();
                        deactivateBlockade();
                        showWelcomeMessage(username);

                        submitBtn.innerHTML = '<i class="fas fa-check"></i> <span>Connecté</span>';
                        message.textContent = 'Connexion réussie ! Redirection...';
                        message.className = 'success-message';
                        message.style.display = 'block';
                        usernameFieldWrap.classList.add('field-valid');
                        passwordFieldWrap.classList.add('field-valid');

                        setTimeout(() => { window.location.href = 'Accueil.html'; }, 2000);

                    } else {
                        const wasBlocked = registerFailedAttempt();
                        const remainingAttempts = MAX_ATTEMPTS - blockData.attempts;

                        usernameFieldWrap.classList.add('field-error');
                        passwordFieldWrap.classList.add('field-error');

                        if (wasBlocked) {
                            message.textContent = "⛔ 3 tentatives échouées. Accès bloqué 1 minute.";
                            message.className = 'warning-message';
                        } else {
                            message.textContent = result.message || 'Identifiants incorrects.';
                            message.className = 'error-message';

                            if (remainingAttempts > 0 && remainingAttempts < MAX_ATTEMPTS) {
                                setTimeout(() => {
                                    if (message.textContent.includes('incorrects')) {
                                        message.textContent = `⚠️ Il reste ${remainingAttempts} tentative(s) avant blocage.`;
                                        message.className = 'warning-message';
                                        setTimeout(() => {
                                            if (message.textContent.includes('reste')) message.style.display = 'none';
                                        }, 3000);
                                    }
                                }, 1500);
                            }
                        }
                        message.style.display = 'block';
                        form.classList.add('shake');
                        setTimeout(() => form.classList.remove('shake'), 500);
                    }

                } catch (error) {
                    console.error('Erreur:', error);
                    message.textContent = "Erreur de connexion au serveur.";
                    message.className = 'error-message';
                    message.style.display = 'block';
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.innerHTML = originalBtnHTML;
                    if (!blockData.isBlocked) submitBtn.disabled = false;
                }
            });
        }

        // ==================== INITIALISATION ====================
        console.log('=== APPLICATION SÉCURISÉE DÉMARRÉE ===');
        initBlockSystem();

        if (isAccessBlocked() && blockData && blockData.blockedUntil) {
            const remaining = blockData.blockedUntil - Date.now();
            if (remaining > 0) activateBlockade(remaining);
        }

        if (blockData && blockData.attempts > 0 && blockData.attempts < MAX_ATTEMPTS && !blockData.isBlocked) {
            const remaining = MAX_ATTEMPTS - blockData.attempts;
            message.textContent = `⚠️ Attention : ${remaining} tentative(s) restante(s) avant blocage.`;
            message.className = 'warning-message';
            message.style.display = 'block';
            setTimeout(() => {
                if (message.textContent.includes('restante')) message.style.display = 'none';
            }, 5000);
        }

        // Autofocus sur le champ nom d'utilisateur si non bloqué
        if (!(blockData && blockData.isBlocked)) {
            usernameInputField.focus();
        }

        console.log('=== APPLICATION PRÊTE ===');
    </script>
</body>
</html>
