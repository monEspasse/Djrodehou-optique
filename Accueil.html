<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4361ee">
<title>VisioPro</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root {
    --brand-50: #eef2ff; --brand-100: #e0e7ff; --brand-200: #c7d2fe;
    --brand-300: #a5b4fc; --brand-400: #818cf8; --brand-500: #6366f1;
    --brand-600: #4f46e5; --brand-700: #4338ca; --brand-800: #3730a3; --brand-900: #312e81;

    --n-0: #ffffff; --n-50: #f8fafc; --n-100: #f1f5f9; --n-200: #e2e8f0;
    --n-300: #cbd5e1; --n-400: #94a3b8; --n-500: #64748b; --n-600: #475569;
    --n-700: #334155; --n-800: #1e293b; --n-900: #0f172a; --n-950: #020617;

    --success: #10b981; --success-bg: #d1fae5;
    --warning: #f59e0b; --warning-bg: #fef3c7;
    --danger:  #ef4444; --danger-bg:  #fee2e2;
    --info:    #3b82f6; --info-bg:    #dbeafe;

    --violet: #8b5cf6; --pink: #ec4899; --cyan: #06b6d4; --lime: #84cc16;

    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;

    --sh-xs: 0 1px 2px rgba(15,23,42,.05);
    --sh-sm: 0 2px 4px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --sh-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --sh-lg: 0 12px 24px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.05);
    --sh-xl: 0 24px 48px rgba(15,23,42,.14), 0 8px 16px rgba(15,23,42,.06);
    --sh-brand: 0 8px 24px rgba(79,70,229,.25);

    --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --r-xl: 20px; --r-2xl: 24px; --r-3xl: 32px; --r-full: 9999px;

    --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem;
    --s-5: 1.25rem; --s-6: 1.5rem; --s-8: 2rem; --s-10: 2.5rem;
    --s-12: 3rem; --s-16: 4rem;

    --ease: cubic-bezier(.4,0,.2,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --dur-fast: 150ms;
    --dur: 250ms;
    --dur-slow: 400ms;

    --sidebar-w: 264px;
    --sidebar-w-collapsed: 72px;
    --header-h: 64px;
}

html[data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111a2e;
    --surface-2: #0f172a;
    --surface-3: #1e293b;
    --border: #1e293b;
    --border-strong: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --sh-xs: 0 1px 2px rgba(0,0,0,.3);
    --sh-sm: 0 2px 4px rgba(0,0,0,.4);
    --sh-md: 0 4px 12px rgba(0,0,0,.5);
    --sh-lg: 0 12px 24px rgba(0,0,0,.55);
    --sh-xl: 0 24px 48px rgba(0,0,0,.6);
}

/* ============================================================
   2. RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }

:focus-visible {
    outline: 2px solid var(--brand-500);
    outline-offset: 2px;
    border-radius: var(--r-xs);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: var(--r-full);
    border: 2px solid transparent;
    background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--n-400); background-clip: content-box; }

.sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.hidden { display: none !important; }

/* ============================================================
   3. APP SHELL
   ============================================================ */
.app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-areas: "sidebar header" "sidebar main";
    min-height: 100vh;
    transition: grid-template-columns var(--dur) var(--ease);
}
.app.sidebar-collapsed { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

/* ============================================================
   4. SIDEBAR
   ============================================================ */
.sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 50;
    transition: all var(--dur) var(--ease);
}
.sidebar-brand {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-4);
    height: var(--header-h);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    transition: padding var(--dur) var(--ease);
}
.brand-logo {
    width: 36px; height: 36px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--brand-500), var(--violet));
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 1rem;
    flex-shrink: 0;
    box-shadow: var(--sh-brand);
    transition: transform var(--dur) var(--ease-spring);
}
.brand-logo:hover { transform: rotate(-6deg) scale(1.05); }
.brand-text {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: -.02em;
    white-space: nowrap;
    background: linear-gradient(135deg, var(--brand-600), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: opacity var(--dur) var(--ease);
}
.app.sidebar-collapsed .brand-text { opacity: 0; pointer-events: none; }

.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--s-3) var(--s-2);
    display: flex;
    flex-direction: column;
    gap: var(--s-1);
}
.nav-section-label {
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-subtle);
    padding: var(--s-3) var(--s-3) var(--s-2);
    white-space: nowrap;
    transition: opacity var(--dur) var(--ease);
}
.app.sidebar-collapsed .nav-section-label { opacity: 0; }

.nav-item {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-3);
    border-radius: var(--r-md);
    color: var(--text-muted);
    font-size: .875rem;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: all var(--dur-fast) var(--ease);
    white-space: nowrap;
}
.nav-item:hover { background: var(--surface-3); color: var(--text); transform: translateX(2px); }
.nav-item.active {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    box-shadow: var(--sh-brand);
}
.nav-item.active::before {
    content: '';
    position: absolute;
    left: -8px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 20px;
    background: var(--brand-500);
    border-radius: var(--r-full);
}
.nav-icon { width: 20px; height: 20px; display: grid; place-items: center; font-size: .95rem; flex-shrink: 0; }
.nav-label { flex: 1; transition: opacity var(--dur) var(--ease); }
.app.sidebar-collapsed .nav-label { opacity: 0; pointer-events: none; }
.nav-badge {
    padding: 2px 6px;
    border-radius: var(--r-full);
    font-size: .65rem;
    font-weight: 700;
    background: var(--success);
    color: #fff;
}
.app.sidebar-collapsed .nav-badge { display: none; }

.nav-sub {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur) var(--ease);
    margin-left: var(--s-6);
    border-left: 1px solid var(--border);
    padding-left: var(--s-3);
}
.nav-item.open + .nav-sub { grid-template-rows: 1fr; }
.nav-sub-inner { overflow: hidden; display: flex; flex-direction: column; gap: 2px; padding: var(--s-1) 0; }
.nav-sub a {
    display: flex; align-items: center; gap: var(--s-2);
    padding: var(--s-2) var(--s-3);
    border-radius: var(--r-sm);
    font-size: .8rem;
    color: var(--text-muted);
    transition: all var(--dur-fast) var(--ease);
}
.nav-sub a:hover { background: var(--surface-3); color: var(--brand-600); }
.nav-sub a i { width: 14px; font-size: .7rem; color: var(--brand-400); }
.app.sidebar-collapsed .nav-sub { display: none; }

.sidebar-footer {
    flex-shrink: 0;
    padding: var(--s-3);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--s-2);
}
.user-chip {
    flex: 1;
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-2);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
    min-width: 0;
}
.user-chip:hover { background: var(--surface-3); }
.user-avatar { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
.user-avatar img {
    width: 100%; height: 100%;
    border-radius: var(--r-full);
    object-fit: cover;
    border: 2px solid var(--surface);
    box-shadow: var(--sh-sm);
}
.user-status {
    position: absolute;
    bottom: -2px; right: -2px;
    width: 12px; height: 12px;
    border-radius: var(--r-full);
    background: var(--success);
    border: 2px solid var(--surface);
    animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
    0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.5); }
    50% { box-shadow: 0 0 0 4px rgba(16,185,129,0); }
}
.user-meta { min-width: 0; flex: 1; transition: opacity var(--dur) var(--ease); }
.app.sidebar-collapsed .user-meta { opacity: 0; pointer-events: none; }
.user-name { font-size: .85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: .7rem; color: var(--text-subtle); display: flex; align-items: center; gap: 4px; }
.user-role i { font-size: .5rem; color: var(--success); }
.btn-icon {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    transition: all var(--dur-fast) var(--ease);
    flex-shrink: 0;
}
.btn-icon:hover { background: var(--surface-3); color: var(--danger); }

/* ============================================================
   5. HEADER
   ============================================================ */
.header {
    grid-area: header;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: 0 var(--s-4);
    position: sticky; top: 0;
    z-index: 40;
}
.btn-menu {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    transition: all var(--dur-fast) var(--ease);
}
.btn-menu:hover { background: var(--surface-3); color: var(--text); }

.breadcrumb { display: flex; align-items: center; gap: var(--s-2); font-size: .85rem; color: var(--text-muted); }
.breadcrumb .current { color: var(--text); font-weight: 600; }
.breadcrumb i { font-size: .6rem; opacity: .5; }
.header-spacer { flex: 1; }

.search-trigger {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-2) var(--s-4);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    color: var(--text-muted);
    font-size: .85rem;
    min-width: 280px;
    transition: all var(--dur-fast) var(--ease);
}
.search-trigger:hover { background: var(--surface); border-color: var(--brand-300); box-shadow: var(--sh-sm); }
.search-trigger kbd {
    margin-left: auto;
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xs);
    font-size: .7rem;
    font-family: inherit;
    color: var(--text-subtle);
}

.header-actions { display: flex; align-items: center; gap: var(--s-1); }
.btn-header {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    position: relative;
    transition: all var(--dur-fast) var(--ease);
}
.btn-header:hover { background: var(--surface-3); color: var(--text); }
.btn-header .dot {
    position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px;
    border-radius: var(--r-full);
    background: var(--danger);
    border: 2px solid var(--surface);
}
.badge-count {
    position: absolute;
    top: 4px; right: 4px;
    min-width: 16px; height: 16px;
    padding: 0 4px;
    border-radius: var(--r-full);
    background: var(--danger);
    color: #fff;
    font-size: .65rem;
    font-weight: 700;
    display: grid; place-items: center;
    border: 2px solid var(--surface);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* ============================================================
   6. MAIN
   ============================================================ */
.main {
    grid-area: main;
    padding: var(--s-6);
    overflow-y: auto;
    overflow-x: hidden;
    max-height: calc(100vh - var(--header-h));
}
@media (min-width: 1400px) { .main { padding: var(--s-8); } }

.page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--s-4);
    margin-bottom: var(--s-6);
    flex-wrap: wrap;
}
.page-title {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, var(--text), var(--brand-600));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.page-subtitle { font-size: .85rem; color: var(--text-muted); margin-top: var(--s-1); }

/* ============================================================
   7. QUICK ACTIONS
   ============================================================ */
.quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--s-3);
    margin-bottom: var(--s-6);
}
.quick-card {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    cursor: pointer;
    text-align: left;
    transition: all var(--dur) var(--ease-spring);
    position: relative;
    overflow: hidden;
}
.quick-card:hover { transform: translateY(-3px); box-shadow: var(--sh-lg); border-color: var(--brand-300); }
.quick-card:hover .quick-icon { transform: scale(1.1) rotate(-6deg); }
.quick-icon {
    width: 44px; height: 44px;
    border-radius: var(--r-md);
    display: grid; place-items: center;
    font-size: 1.1rem;
    color: #fff;
    flex-shrink: 0;
    transition: transform var(--dur) var(--ease-spring);
}
.quick-card[data-color="brand"]  .quick-icon { background: linear-gradient(135deg, var(--brand-500), var(--brand-700)); }
.quick-card[data-color="violet"] .quick-icon { background: linear-gradient(135deg, var(--violet), #7c3aed); }
.quick-card[data-color="pink"]   .quick-icon { background: linear-gradient(135deg, var(--pink), #db2777); }
.quick-card[data-color="cyan"]   .quick-icon { background: linear-gradient(135deg, var(--cyan), #0891b2); }
.quick-card[data-color="lime"]   .quick-icon { background: linear-gradient(135deg, var(--lime), #65a30d); }
.quick-title { font-weight: 700; font-size: .9rem; }
.quick-desc  { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }

/* ============================================================
   8. CARDS & TABLES
   ============================================================ */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    transition: box-shadow var(--dur) var(--ease);
}
.card:hover { box-shadow: var(--sh-md); }
.card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-4);
    padding: var(--s-4) var(--s-5);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
}
.card-title {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    font-size: 1rem;
    font-weight: 700;
}
.card-title-icon {
    width: 32px; height: 32px;
    border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    display: grid; place-items: center;
    font-size: .8rem;
}

.table-wrap { overflow-x: auto; max-height: 480px; }
.table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
    font-size: .875rem;
}
.table thead {
    position: sticky; top: 0;
    background: var(--surface-2);
    z-index: 5;
    backdrop-filter: blur(8px);
}
.table th {
    padding: var(--s-3) var(--s-4);
    text-align: left;
    font-weight: 700;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
    transition: color var(--dur-fast) var(--ease);
    white-space: nowrap;
}
.table th:hover { color: var(--brand-600); }
.table th[data-sort]::after {
    content: '\f0dc';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    margin-left: var(--s-2);
    opacity: .3;
    font-size: .65rem;
}
.table th[data-sort="asc"]::after  { content: '\f0de'; opacity: 1; color: var(--brand-500); }
.table th[data-sort="desc"]::after { content: '\f0dd'; opacity: 1; color: var(--brand-500); }
.table td {
    padding: var(--s-3) var(--s-4);
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
}
.table tbody tr { transition: background var(--dur-fast) var(--ease); cursor: pointer; }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:hover td { color: var(--text); }
.client-link { color: var(--brand-600); font-weight: 600; }

/* ============================================================
   9. PAGINATION
   ============================================================ */
.pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-5);
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    flex-wrap: wrap;
}
.pagination-info { font-size: .8rem; color: var(--text-muted); }
.pagination-nav { display: flex; gap: var(--s-2); }
.page-btn {
    padding: var(--s-2) var(--s-3);
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r-sm);
    color: var(--text-muted);
    font-size: .8rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    transition: all var(--dur-fast) var(--ease);
}
.page-btn:hover:not(:disabled) {
    border-color: var(--brand-400);
    color: var(--brand-600);
    transform: translateY(-1px);
    box-shadow: var(--sh-sm);
}
.page-btn:disabled { opacity: .4; cursor: not-allowed; }
.page-btn.icon-only { padding: var(--s-2); min-width: 32px; justify-content: center; }

/* ============================================================
   10. SEARCH INPUT
   ============================================================ */
.search-box { position: relative; min-width: 220px; }
.search-box i {
    position: absolute; left: var(--s-3); top: 50%;
    transform: translateY(-50%);
    color: var(--text-subtle);
    font-size: .8rem;
    pointer-events: none;
}
.search-box input {
    width: 100%;
    padding: var(--s-2) var(--s-3) var(--s-2) 34px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    font-size: .85rem;
    transition: all var(--dur-fast) var(--ease);
}
.search-box input:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--brand-400);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
}

/* ============================================================
   11. COMMAND PALETTE
   ============================================================ */
.palette-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
    z-index: 9999;
    animation: fadeIn var(--dur) var(--ease);
}
.palette-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.palette {
    width: min(640px, 92vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-xl);
    overflow: hidden;
    animation: popIn var(--dur) var(--ease-spring);
}
@keyframes popIn {
    from { opacity: 0; transform: translateY(-16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.palette-input {
    width: 100%;
    padding: var(--s-4) var(--s-5);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 1rem;
    color: var(--text);
}
.palette-input:focus { outline: none; }
.palette-list { max-height: 60vh; overflow-y: auto; padding: var(--s-2); }
.palette-item {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-4);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
}
.palette-item:hover, .palette-item.selected { background: var(--surface-3); }
.palette-item.selected { background: linear-gradient(135deg, var(--brand-50), var(--surface-3)); }
.palette-item-icon {
    width: 32px; height: 32px;
    border-radius: var(--r-sm);
    background: var(--surface-3);
    color: var(--brand-600);
    display: grid; place-items: center;
    font-size: .8rem;
    flex-shrink: 0;
}
.palette-item-label { flex: 1; font-size: .875rem; font-weight: 500; }
.palette-item-hint {
    font-size: .7rem;
    color: var(--text-subtle);
    padding: 2px 6px;
    background: var(--surface-3);
    border-radius: var(--r-xs);
}
.palette-empty { text-align: center; padding: var(--s-8); color: var(--text-subtle); font-size: .85rem; }

/* ============================================================
   12. TOASTS
   ============================================================ */
.toast-container {
    position: fixed;
    top: var(--s-4); right: var(--s-4);
    display: flex;
    flex-direction: column;
    gap: var(--s-2);
    z-index: 10000;
    pointer-events: none;
    max-width: 380px;
}
.toast {
    display: flex;
    align-items: flex-start;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--toast-color, var(--brand-500));
    border-radius: var(--r-md);
    box-shadow: var(--sh-lg);
    pointer-events: auto;
    animation: toastIn var(--dur) var(--ease-spring);
    position: relative;
    overflow: hidden;
}
.toast::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    width: 100%;
    background: var(--toast-color, var(--brand-500));
    animation: progress 4s linear forwards;
}
@keyframes toastIn {
    from { opacity: 0; transform: translateX(100%); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes toastOut { to { opacity: 0; transform: translateX(100%); } }
@keyframes progress { from { width: 100%; } to { width: 0%; } }
.toast.out { animation: toastOut var(--dur) var(--ease) forwards; }
.toast-icon {
    width: 32px; height: 32px;
    border-radius: var(--r-full);
    background: color-mix(in srgb, var(--toast-color) 15%, transparent);
    color: var(--toast-color, var(--brand-500));
    display: grid; place-items: center;
    font-size: .85rem;
    flex-shrink: 0;
}
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: .85rem; font-weight: 700; }
.toast-msg   { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }
.toast-close {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: var(--r-sm);
    color: var(--text-subtle);
    font-size: .7rem;
    transition: all var(--dur-fast) var(--ease);
}
.toast-close:hover { background: var(--surface-3); color: var(--text); }

/* ============================================================
   13. MODAL GENERIC
   ============================================================ */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--s-4);
    z-index: 1000;
    animation: fadeIn var(--dur) var(--ease);
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    width: 100%;
    max-width: 1200px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: var(--sh-xl);
    animation: popIn var(--dur-slow) var(--ease-spring);
    position: relative;
}
.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--s-5) var(--s-6);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--surface);
    z-index: 5;
}
.modal-head.gradient {
    background: linear-gradient(135deg, var(--brand-600), var(--violet));
    color: #fff;
    border-bottom: none;
}
.modal-head.proforma {
    background: linear-gradient(135deg, #f97316, var(--pink));
    color: #fff;
    border-bottom: none;
}
.modal-title { font-size: 1.15rem; font-weight: 700; }
.modal-close {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    background: rgba(255,255,255,.15);
    color: inherit;
    transition: all var(--dur-fast) var(--ease);
}
.modal-close:hover { background: rgba(255,255,255,.25); transform: rotate(90deg); }
.modal-body { padding: var(--s-6); }

/* Product form helpers */
.form-group { margin-bottom: var(--s-4); }
.form-group label {
    display: block;
    font-weight: 600;
    font-size: .875rem;
    margin-bottom: var(--s-2);
    color: var(--text);
}
.form-control {
    width: 100%;
    padding: var(--s-3);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: .9rem;
    transition: all var(--dur-fast) var(--ease);
}
.form-control:focus {
    outline: none;
    border-color: var(--brand-400);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
}
.form-control:read-only { background: var(--surface-3); cursor: not-allowed; }
.required-field::after { content: ' *'; color: var(--danger); }
.form-message { margin-top: var(--s-2); font-weight: 600; font-size: .85rem; }

const $ = id => document.getElementById(id);

const formatCurrency = amount => {
    const n = Number(amount);
    if (!isFinite(n)) return '0 FCFA';
    return Math.round(n).toLocaleString('fr-FR') + ' FCFA';
};

const formatDate = dateStr => {
    if (!dateStr) return '';
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(String(dateStr))) return dateStr;
    try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch { return dateStr; }
};

/* ---- Patch sécurité : échappement HTML ---- */
const escapeHtml = (str) => {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
};

const debounce = (fn, delay = 250) => {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
};

/* ---- Toast moderne (composant unique) ---- */
function showToast(type, title, message, duration = 4000) {
    const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
    const icons = { success: 'fa-check', error: 'fa-xmark', warning: 'fa-exclamation', info: 'fa-info' };
    const container = $('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.setProperty('--toast-color', colors[type] || colors.info);
    toast.innerHTML = `
        <div class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></div>
        <div class="toast-body">
            <div class="toast-title">${escapeHtml(title)}</div>
            ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ''}
        </div>
        <button class="toast-close" aria-label="Fermer"><i class="fas fa-xmark"></i></button>
    `;
    container.appendChild(toast);
    const remove = () => { toast.classList.add('out'); setTimeout(() => toast.remove(), 300); };
    toast.querySelector('.toast-close').onclick = remove;
    setTimeout(remove, duration);
}

/* ============================================================
   GESTION CENTRALISÉE DES ERREURS API
   ============================================================ */
const AUTH_ERROR_PATTERNS = [
    /token\s*manquant/i,
    /token\s*invalide/i,
    /token\s*expir/i,
    /session\s*expir/i,
    /non\s*authentifi/i,
    /unauthorized/i,
    /forbidden/i,
];

function isAuthError(error) {
    if (!error) return false;
    const msg = (error.message || String(error)).toLowerCase();

    // ✅ Exclure explicitement les erreurs non-auth
    if (/timeout|délai|abort/i.test(msg)) return false;
    if (/réseau|network|failed to fetch/i.test(msg)) return false;
    if (/html|json|réponse invalide|invalid/i.test(msg)) return false;

    // HTTP 401 / 403
    if (/statut\s*:\s*40[13]/i.test(msg)) return true;
    if (/http\s*40[13]/i.test(msg)) return true;

    // Motifs textuels
    return AUTH_ERROR_PATTERNS.some(re => re.test(msg));
}

/**
 * Gère une erreur API de manière centralisée.
 * @returns {boolean} true si l'erreur a été traitée comme auth (déconnexion en cours)
 */
function handleApiError(error, context = 'API') {
    console.error(`❌ [${context}]`, error);

    if (isAuthError(error)) {
        showToast('error', 'Session expirée', 'Redirection vers la connexion…', 2500);
        stopNotificationCarousel();
        sessionStorage.clear();
        localStorage.removeItem('utilisateur');
        localStorage.removeItem('token');
        setTimeout(() => { window.location.href = 'code.html'; }, 1200);
        return true;
    }

    const msg = error?.message || 'Une erreur est survenue';
    showToast('error', `Erreur ${context}`, msg, 5000);
    return false;
}

/**
 * Wrapper fetch avec timeout + gestion d'erreur unifiée + détection HTML.
 */
async function safeFetch(url, options = {}, timeoutMs = 100000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        if (res.status === 401 || res.status === 403) {
            throw new Error(`Token invalide - HTTP ${res.status}`);
        }
        if (!res.ok) {
            throw new Error(`Erreur HTTP: ${res.status}`);
        }
        // ✅ Détecte un retour non-JSON (page d'erreur HTML de GAS)
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
            const clone = res.clone();
            const text = await clone.text();
            if (text.trim().startsWith('<')) {
                throw new Error('Réponse invalide du serveur (HTML)');
            }
        }
        return res;
    } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') throw new Error('Délai dépassé (timeout)');
        throw err;
    }
}

/* ============================================================
   API
   ============================================================ */
async function apiCall(action, method = 'GET', data = null) {
    const token = sessionStorage.getItem('apiToken');
    if (!token && action !== 'login') {
        console.error('❌ Pas de token');
        window.location.href = 'code.html';
        throw new Error('Non authentifié');
    }
    let url = `${CONFIG.API_BASE}?action=${action}`;
    if (token) url += `&token=${encodeURIComponent(token)}`;
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (method === 'POST' && data) options.body = JSON.stringify({ ...data, token });
    const response = await fetch(url, options);
    return response.json();
}

/* ============================================================
   CATALOGUE — Cache robuste avec retry automatique
   ============================================================ */
let cataloguePromise = null;  // dédup des appels concurrents

async function fetchCatalogueData(forceRefresh = false) {
    const now = Date.now();

    // Cache valide (60 s)
    if (!forceRefresh && AppState.catalogueCache && (now - AppState.catalogueCacheTime) < 60000) {
        return AppState.catalogueCache;
    }

    // Dédup : si un appel est déjà en cours, on attend le même
    if (cataloguePromise) return cataloguePromise;

    const token = sessionStorage.getItem('apiToken');
    if (!token) return null;

    cataloguePromise = (async () => {
        const tryFetch = async () => {
            const resp = await fetch(
                `${CONFIG.API_BASE}?action=catalogue&token=${encodeURIComponent(token)}`,
                { cache: 'no-store' }
            );
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const ct = resp.headers.get('content-type') || '';
            if (!ct.includes('application/json')) {
                throw new Error('Réponse invalide (HTML)');
            }
            const data = await resp.json();
            if (data && data.success && data.data) return data.data;
            throw new Error(data?.message || 'Catalogue vide');
        };

        try {
            const data = await tryFetch();
            AppState.catalogueCache = data;
            AppState.catalogueCacheTime = Date.now();
            return data;
        } catch (err) {
            console.warn('⚠️ fetchCatalogueData échec, retry dans 1.5s', err);
            // ✅ On n'empoisonne PAS le cache
            AppState.catalogueCache = null;
            AppState.catalogueCacheTime = 0;

            // Retry automatique 1 fois
            await new Promise(r => setTimeout(r, 1500));
            try {
                const data2 = await tryFetch();
                AppState.catalogueCache = data2;
                AppState.catalogueCacheTime = Date.now();
                return data2;
            } catch (e2) {
                console.error('❌ fetchCatalogueData retry échoué', e2);
                return null;
            }
        } finally {
            cataloguePromise = null;
        }
    })();

    return cataloguePromise;
}

let monturePromise = null;
async function fetchMonturesData() {
    const now = Date.now();
    if (AppState.montureCache && (now - AppState.montureCacheTime) < 60000) {
        return AppState.montureCache;
    }
    if (monturePromise) return monturePromise;

    const token = sessionStorage.getItem('apiToken');
    if (!token) return null;

    monturePromise = (async () => {
        try {
            const resp = await fetch(
                `${CONFIG.API_BASE}?action=stockmonture&token=${encodeURIComponent(token)}`,
                { cache: 'no-store' }
            );
            const data = await resp.json();
            if (data && data.success && data.data) {
                AppState.montureCache = data.data;
                AppState.montureCacheTime = Date.now();
                return data.data;
            }
            return null;
        } catch (e) {
            console.error('❌ fetchMonturesData', e);
            return null;
        } finally {
            monturePromise = null;
        }
    })();

    return monturePromise;
}

/* ============================================================
   INACTIVITÉ — avec avertissement 30s avant déconnexion
   ============================================================ */
let inactivityTimeout;
let countdownInterval;
let countdownToast = null;

function startInactivityTimer() {
    const TIMEOUT      = 30 * 60 * 1000;
    const WARNING_AT   = 30 * 1000;
    const WARNING_DELAY = TIMEOUT - WARNING_AT;

    const reset = () => {
        clearTimeout(inactivityTimeout);
        clearInterval(countdownInterval);
        if (countdownToast) {
            countdownToast.remove();
            countdownToast = null;
        }
        inactivityTimeout = setTimeout(() => showCountdownWarning(TIMEOUT, WARNING_AT), WARNING_DELAY);
    };

    ['load', 'mousemove', 'keydown', 'click', 'scroll', 'touchstart', 'input']
        .forEach(e => window.addEventListener(e, reset, true));

    reset();
}

function showCountdownWarning(TIMEOUT, WARNING_AT) {
    let remaining = Math.round(WARNING_AT / 1000);

    countdownToast = document.createElement('div');
    countdownToast.className = 'toast';
    countdownToast.style.setProperty('--toast-color', 'var(--warning)');
    countdownToast.innerHTML = `
        <div class="toast-icon"><i class="fas fa-clock"></i></div>
        <div class="toast-body">
            <div class="toast-title">Déconnexion imminente</div>
            <div class="toast-msg">
                Vous serez déconnecté dans
                <strong id="countdownSeconds" style="color:var(--warning);font-variant-numeric:tabular-nums;">${remaining}</strong>
                seconde${remaining > 1 ? 's' : ''}…
            </div>
            <button id="stayConnectedBtn" style="margin-top:8px;padding:6px 12px;background:var(--warning);color:#fff;border:none;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;">
                <i class="fas fa-hand"></i> Rester connecté
            </button>
        </div>
    `;
    countdownToast.querySelector('.toast-close')?.remove();
    $('toastContainer').appendChild(countdownToast);

    $('stayConnectedBtn').addEventListener('click', () => {
        clearInterval(countdownInterval);
        if (countdownToast) { countdownToast.remove(); countdownToast = null; }
        showSuccess('Session prolongée');
        startInactivityTimer();
    });

    const secondsEl = $('countdownSeconds');
    countdownInterval = setInterval(() => {
        remaining--;
        if (secondsEl) secondsEl.textContent = remaining;
        if (remaining <= 10 && countdownToast) {
            countdownToast.style.setProperty('--toast-color', 'var(--danger)');
        }
        if (remaining <= 0) {
            clearInterval(countdownInterval);
            stopNotificationCarousel();
            sessionStorage.clear();
            localStorage.removeItem("utilisateur");
            localStorage.removeItem("token");
            window.location.href = "code.html";
        }
    }, 1000);
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
async function loadNotifications() {
    try {
        const token = sessionStorage.getItem('apiToken');
        if (!token) return false;
        const response = await fetch(`${CONFIG.API_BASE}?action=notification&token=${encodeURIComponent(token)}`, { cache: 'no-store' });
        const data = await response.json();
        if (data.success && data.data && Array.isArray(data.data.rows)) {
            const now = new Date();
            AppState.notifications.all = data.data.rows
                .map(row => ({
                    dateFin: row[0] || null,
                    message: row[1] || 'Nouvelle notification',
                    priorite: row[2] || 'Information',
                    dateCreation: data.timestamp || new Date().toISOString()
                }))
                .filter(n => {
                    if (!n.dateFin) return true;
                    const d = new Date(n.dateFin);
                    return !isNaN(d.getTime()) && d > now;
                });
            updateNotificationCount();
            if (AppState.notifications.all.length > 0) startNotificationCarousel();
            return true;
        }
        return false;
    } catch (error) {
        console.error('❌ Erreur chargement notifications:', error);
        return false;
    }
}

function updateNotificationCount() {
    const count = AppState.notifications.all.length;
    const el = $('notificationCount');
    if (el) { el.textContent = count; el.style.display = count > 0 ? 'grid' : 'none'; }
}

function startNotificationCarousel() {
    if (AppState.notifications.interval) { clearInterval(AppState.notifications.interval); AppState.notifications.interval = null; }
    AppState.notifications.currentIndex = 0;
    const total = AppState.notifications.all.length;
    if (total === 0) return;
    showNotificationWithCount();
    AppState.notifications.interval = setInterval(() => {
        if (AppState.notifications.currentIndex >= total) { stopNotificationCarousel(); return; }
        showNotificationWithCount();
    }, 4000);
}

function showNotificationWithCount() {
    const n = AppState.notifications.all[AppState.notifications.currentIndex];
    if (!n) { stopNotificationCarousel(); return; }
    const c = AppState.notifications.currentIndex + 1;
    const t = AppState.notifications.all.length;
    showNotificationToast(n, c, t);
    AppState.notifications.currentIndex++;
}

function showNotificationToast(notification, current, total) {
    const typeMap = { 'urgent': 'error', 'haute': 'error', 'moyenne': 'warning', 'basse': 'info' };
    const type = typeMap[(notification.priorite || '').toLowerCase()] || 'info';
    const counter = current && total ? ` (${current}/${total})` : '';
    showToast(type, `Notification${counter}`, notification.message, 3800);
}

function stopNotificationCarousel() {
    if (AppState.notifications.interval) {
        clearInterval(AppState.notifications.interval);
        AppState.notifications.interval = null;
        AppState.notifications.isPlaying = false;
    }
}

function generateNotificationListHTML() {
    if (AppState.notifications.all.length === 0) {
        return `<div style="text-align:center;padding:var(--s-8);color:var(--text-subtle);"><i class="fas fa-bell-slash" style="font-size:2.5rem;margin-bottom:var(--s-3);opacity:.4;"></i><p>Aucune notification</p></div>`;
    }
    return AppState.notifications.all.map(n => {
        const pr = (n.priorite || '').toLowerCase();
        const color = pr === 'urgent' || pr === 'haute' ? 'var(--danger)' : pr === 'moyenne' ? 'var(--warning)' : 'var(--info)';
        const icon = pr === 'urgent' || pr === 'haute' ? 'fa-exclamation-circle' : pr === 'moyenne' ? 'fa-bell' : 'fa-info-circle';
        let dateExp = '';
        if (n.dateFin) {
            const d = new Date(n.dateFin);
            if (!isNaN(d.getTime())) dateExp = `<span><i class="far fa-calendar-times"></i> Expire: ${d.toLocaleDateString('fr-FR')}</span>`;
        }
        return `<div style="border-left:4px solid ${color};padding:var(--s-3);display:flex;gap:var(--s-3);border-bottom:1px solid var(--border);">
            <div style="background:${color};width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0;"><i class="fas ${icon}"></i></div>
            <div style="flex:1;min-width:0;">
                <div style="font-weight:700;">${escapeHtml(n.message)}</div>
                <div style="font-size:.8rem;color:var(--text-muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;"><span><i class="fas fa-tag"></i> ${escapeHtml(n.priorite)}</span>${dateExp}</div>
            </div>
        </div>`;
    }).join('');
}

async function refreshNotifications() {
    const ok = await loadNotifications();
    const modal = $('notificationModal');
    if (modal) {
        const list = modal.querySelector('.notification-list');
        if (list) list.innerHTML = generateNotificationListHTML();
        const title = modal.querySelector('.modal-title');
        if (title) title.innerHTML = `<i class="fas fa-bell"></i> Notifications (${AppState.notifications.all.length})`;
    }
    if (ok) showSuccess('Notifications actualisées');
    else showError('Impossible de charger les notifications');
}

   CLIENTS
   ============================================================ */
async function loadClientsFromScript() {
    const search = $('searchInput');
    if (search) { search.disabled = true; search.placeholder = "Chargement..."; }

    try {
        const token = sessionStorage.getItem('apiToken');
        if (!token) throw new Error("Token manquant - Veuillez vous reconnecter");

        const response = await safeFetch(
            `${CONFIG.API_BASE}?action=liste&token=${encodeURIComponent(token)}`
        );
        const data = await response.json();

        if (!data.success) throw new Error(data.message || "Erreur lors du chargement");
        if (!data.data || !data.data.headers || !data.data.rows) {
            throw new Error("Réponse invalide du serveur");
        }

        AppState.clients.headers  = data.data.headers;
        AppState.clients.all      = data.data.rows;
        AppState.clients.filtered = AppState.clients.all;
        renderTableHeaders();
        updateTableAndPagination();

        if (search) {
            search.disabled = false;
            search.placeholder = "Rechercher par nom...";
        }
    } catch (error) {
        handleApiError(error, 'Clients');
        if (search) {
            search.disabled = false;
            search.placeholder = "Rechercher par nom...";
        }
    }
}

function getColIndex(needle, fallback = 0) {
    const idx = AppState.clients.headers.findIndex(h => String(h || '').toLowerCase().includes(needle));
    return idx >= 0 ? idx : fallback;
}

function renderTableHeaders() {
    const thead = document.querySelector("#client-table thead");
    if (!thead) return;
    thead.innerHTML = "";
    const tr = document.createElement("tr");
    AppState.clients.headers.forEach((h, i) => {
        const th = document.createElement("th");
        th.textContent = h;
        th.setAttribute('data-sort', AppState.clients.sortColumn === i ? AppState.clients.sortDirection : '');
        th.addEventListener('click', () => sortTable(i));
        tr.appendChild(th);
    });
    thead.appendChild(tr);
}

function renderTableRows() {
    const tbody = document.querySelector("#client-table tbody");
    if (!tbody) return;
    tbody.innerHTML = "";
    const start = (AppState.clients.currentPage - 1) * AppState.clients.itemsPerPage;
    const end = start + AppState.clients.itemsPerPage;
    const rows = AppState.clients.filtered.slice(start, end);
    if (rows.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = AppState.clients.headers.length || 1;
        td.textContent = "Aucun client trouvé";
        td.style.textAlign = "center";
        td.style.padding = "2rem";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
    }
    const dateColIdx = getColIndex('date', -1);
    const nomColIdx = getColIndex('nom', 0);
    rows.forEach((row, localIdx) => {
        const tr = document.createElement("tr");
        tr.addEventListener('click', () => selectClient(row));
        row.forEach((cell, idx) => {
            const td = document.createElement("td");
            if (idx === nomColIdx) {
                const link = document.createElement("a");
                link.href = "#";
                link.className = "client-link has-tooltip";
                link.textContent = cell || "";
                link.onclick = (e) => { e.preventDefault(); selectClient(row); };
                link.dataset.localIndex = String(localIdx);
                td.appendChild(link);
            } else if (idx === dateColIdx) {
                td.textContent = formatDate(cell);
            } else {
                td.textContent = cell || "";
            }
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    initializeTooltips();
}

function updateTableAndPagination() {
    renderTableHeaders();
    renderTableRows();
    const total = AppState.clients.filtered.length;
    const totalPages = Math.ceil(total / AppState.clients.itemsPerPage) || 1;
    const first = $('firstPage');
    const prev = $('prevPage');
    const next = $('nextPage');
    const last = $('lastPage');
    if (first) first.disabled = AppState.clients.currentPage <= 1;
    if (prev) prev.disabled = AppState.clients.currentPage <= 1;
    if (next) next.disabled = AppState.clients.currentPage >= totalPages;
    if (last) last.disabled = AppState.clients.currentPage >= totalPages;
    const info = $('page-info');
    if (info) {
        if (total === 0) info.textContent = "Aucun client";
        else info.textContent = `Page ${AppState.clients.currentPage} sur ${totalPages} • ${total} clients`;
    }
}

function compareValues(va, vb) {
    const na = parseFloat(String(va ?? '').replace(/\s/g, '').replace(',', '.'));
    const nb = parseFloat(String(vb ?? '').replace(/\s/g, '').replace(',', '.'));
    const bothNumeric = !isNaN(na) && !isNaN(nb) && String(va).trim() !== '' && String(vb).trim() !== '';
    if (bothNumeric) return na - nb;
    return String(va ?? '').localeCompare(String(vb ?? ''), 'fr', { numeric: true, sensitivity: 'base' });
}

function sortTable(col) {
    if (AppState.clients.sortColumn === col) {
        if (AppState.clients.sortDirection === 'asc') AppState.clients.sortDirection = 'desc';
        else if (AppState.clients.sortDirection === 'desc') { AppState.clients.sortColumn = null; AppState.clients.sortDirection = 'asc'; }
    } else {
        AppState.clients.sortColumn = col;
        AppState.clients.sortDirection = 'asc';
    }
    applySortIfActive();
    updateTableAndPagination();
}

function applySortIfActive() {
    if (AppState.clients.sortColumn === null) return;
    const col = AppState.clients.sortColumn;
    const dir = AppState.clients.sortDirection;
    AppState.clients.filtered.sort((a, b) => {
        const cmp = compareValues(a[col], b[col]);
        return dir === 'asc' ? cmp : -cmp;
    });
}

function applySearchFilter() {
    const input = $('searchInput');
    if (!input) return;
    const term = input.value.toLowerCase().trim();
    const nomColIdx = getColIndex('nom', 1);
    AppState.clients.filtered = term
        ? AppState.clients.all.filter(c => String(c[nomColIdx] || '').toLowerCase().includes(term))
        : AppState.clients.all.slice();
    AppState.clients.currentPage = 1;
    applySortIfActive();
    updateTableAndPagination();
}

function selectClient(data) {
    localStorage.setItem("selectedClient", JSON.stringify(data));
    window.location.href = "DetailClient.html";
}
function goToPrevPage() { if (AppState.clients.currentPage > 1) { AppState.clients.currentPage--; updateTableAndPagination(); } }
function goToNextPage() {
    const total = Math.ceil(AppState.clients.filtered.length / AppState.clients.itemsPerPage);
    if (AppState.clients.currentPage < total) { AppState.clients.currentPage++; updateTableAndPagination(); }
}
function goToFirstPage() { if (AppState.clients.currentPage !== 1) { AppState.clients.currentPage = 1; updateTableAndPagination(); } }
function goToLastPage() {
    const total = Math.ceil(AppState.clients.filtered.length / AppState.clients.itemsPerPage) || 1;
    if (AppState.clients.currentPage !== total) { AppState.clients.currentPage = total; updateTableAndPagination(); }
}

/* ---- Tooltips clients au survol ---- */
function createClientTooltip(client) {
    const headers = AppState.clients.headers || [];
    const findIdx = (needle, fallback) => {
        const i = headers.findIndex(h => String(h || '').toLowerCase().includes(needle));
        return i >= 0 ? i : fallback;
    };
    const idxNom = findIdx('nom', 1);
    const idxMontant = findIdx('montant ttc', findIdx('total', 39));
    const idxReste = findIdx('reste', 54);
    const nom = client[idxNom] || "Non spécifié";
    const montant = parseFloat(client[idxMontant]) || 0;
    const reste = parseFloat(client[idxReste]) || 0;
    return `<div class="client-tooltip">
        <div class="tooltip-header">Détails Client</div>
        <div class="tooltip-row"><span class="tooltip-label">Nom:</span><span class="tooltip-value">${escapeHtml(nom)}</span></div>
        <div class="tooltip-row"><span class="tooltip-label">Total:</span><span class="tooltip-value amount">${formatCurrency(montant)}</span></div>
        <div class="tooltip-row"><span class="tooltip-label">Reste:</span><span class="tooltip-value rest">${formatCurrency(reste)}</span></div>
    </div>`;
}

function initializeTooltips() {
    document.querySelectorAll('.has-tooltip').forEach(el => {
        if (el.dataset.tooltipBound === '1') return;
        el.dataset.tooltipBound = '1';
        let tooltip = null, timeout = null;
        el.addEventListener('mouseenter', () => {
            timeout = setTimeout(() => {
                const localIdx = parseInt(el.dataset.localIndex || '0', 10);
                const start = (AppState.clients.currentPage - 1) * AppState.clients.itemsPerPage;
                const client = AppState.clients.filtered[start + localIdx];
                if (!client) return;
                tooltip = document.createElement('div');
                tooltip.className = 'custom-tooltip';
                tooltip.innerHTML = createClientTooltip(client);
                const rect = el.getBoundingClientRect();
                tooltip.style.left = rect.left + 'px';
                tooltip.style.top = (rect.top - 10) + 'px';
                tooltip.style.transform = 'translateY(-100%)';
                document.body.appendChild(tooltip);
            }, 1000);
        });
        el.addEventListener('mouseleave', () => {
            clearTimeout(timeout);
            if (tooltip && tooltip.parentNode) { tooltip.parentNode.removeChild(tooltip); tooltip = null; }
        });
    });
}

async function loadFournisseurs(selectId) {
    const select = $(selectId);
    if (!select) return;
    select.innerHTML = '<option value="">-- Chargement --</option>';
    try {
        const data = await fetchCatalogueData();
        // ✅ Vérifie que le select existe toujours dans le DOM
        if (!select.isConnected) return;
        if (data && Array.isArray(data.fournisseur) && data.fournisseur.length) {
            select.innerHTML = '<option value="">-- Sélectionnez --</option>';
            data.fournisseur.slice().sort((a, b) => String(a).localeCompare(String(b), 'fr')).forEach(f => {
                const o = document.createElement('option'); o.value = f; o.textContent = f; select.appendChild(o);
            });
        } else {
            select.innerHTML = '<option value="">-- Aucune donnée --</option>';
        }
    } catch (error) {
        console.error("Erreur fournisseurs:", error);
        if (select.isConnected) select.innerHTML = '<option value="">-- Erreur --</option>';
    }
}

window.submitProductForm = async function() {
    const form = $('productForm'), msg = $('product-message');
    if (!form || !msg) return;
    msg.textContent = '';
    const cat = $('productCategory')?.value;
    const qty = $('productQuantity')?.value;
    if (!cat) { msg.textContent = '❌ Sélectionnez une catégorie'; msg.style.color = 'var(--danger)'; return; }
    if (!qty || parseInt(qty, 10) < 1) { msg.textContent = '❌ Quantité invalide'; msg.style.color = 'var(--danger)'; return; }
    const data = { category: cat, quantity: qty, utilisateur: AppState.user.nom || "Inconnu", token: sessionStorage.getItem('apiToken') };
    try {
        if (cat === 'monture') {
            const ref = $('montureReference')?.value, prix = $('monturePrix')?.value, sup = $('montureSupplier')?.value;
            if (!ref || !prix || !sup) { msg.textContent = '❌ Remplissez tous les champs obligatoires'; msg.style.color = 'var(--danger)'; return; }
            data.reference = ref; data.prix = prix; data.supplier = sup;
        } else if (cat === 'etui') {
            const ref = $('etuiReference')?.value, sup = $('etuiSupplier')?.value;
            if (!ref || !sup) { msg.textContent = '❌ Remplissez tous les champs obligatoires'; msg.style.color = 'var(--danger)'; return; }
            data.reference = ref; data.supplier = sup;
        } else if (cat === 'nettoyant') {
            const sup = $('nettoyantSupplier')?.value;
            if (!sup) { msg.textContent = '❌ Sélectionnez une agence'; msg.style.color = 'var(--danger)'; return; }
            data.supplier = sup;
        } else if (cat === 'autre') {
            data.reference = $('autreReference')?.value || '';
            data.supplier = $('autreSupplier')?.value || '';
            data.info = $('autreInfo')?.value || '';
        }
        const btn = document.querySelector('#productModal .page-btn:last-child');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...'; }
        await fetch(`${CONFIG.API_BASE}${CONFIG.ENDPOINTS.addProduct}`, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        msg.textContent = '✅ Produit enregistré avec succès !';
        msg.style.color = 'var(--success)';
        form.reset();
        const pc = $('productCategory'); if (pc) pc.value = '';
        const df = $('dynamicFields'); if (df) df.innerHTML = '';
        if (btn) { btn.disabled = false; btn.innerHTML = 'Enregistrer'; }
        setTimeout(() => { if (msg) msg.textContent = ''; }, 3000);
    } catch (error) {
        console.error('Erreur:', error);
        msg.textContent = '❌ Erreur lors de l\'enregistrement';
        msg.style.color = 'var(--danger)';
        const btn = document.querySelector('#productModal .page-btn:last-child');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Enregistrer'; }
    }
};

window.toggleCustomInput = function(fieldName, evt) {
    const select = $(fieldName), input = $(fieldName + '_input');
    const button = (evt && evt.currentTarget) || (window.event && window.event.currentTarget);
    if (!select || !input || !button) return;
    if (input.style.display !== 'block') {
        select.style.display = 'none';
        input.style.display = 'block';
        input.value = '';
        button.innerHTML = '<i class="fas fa-list"></i> Choisir existant';
        input.focus();
    } else {
        select.style.display = 'block';
        input.style.display = 'none';
        button.innerHTML = '<i class="fas fa-plus"></i> Ajouter nouveau';
        if (input.value.trim()) addOptionIfNotExists(select, input.value.trim());
    }
};

function addOptionIfNotExists(select, value) {
    for (let o of select.options) { if (o.text === value) { select.value = value; return; } }
    const opt = document.createElement('option'); opt.value = value; opt.text = value; select.add(opt); select.value = value;
}

async function initSaleModal() {
    AppState.modals.sale.currentStep = 1;
    updateSaleStepDisplay();
    calculerTotal();
    const today = new Date();
    const delivery = new Date(today); delivery.setDate(today.getDate() + 15);
    const dl = $('date_livraison'); if (dl) dl.value = delivery.toISOString().split('T')[0];
    const cu = $('current_user'); if (cu) cu.value = AppState.user.nom;

    // ✅ On attend le catalogue AVANT de brancher les events
    await loadCatalogueData('sale');

    $('prevStepBtn') && ($('prevStepBtn').onclick = prevSaleStep);
    $('nextStepBtn') && ($('nextStepBtn').onclick = nextSaleStep);
    $('resetButton') && ($('resetButton').onclick = resetSaleForm);
    $('submitBtn') && ($('submitBtn').onclick = submitSaleForm);

    ['montant_monture','montant_verres','remise','part_assurance','acompte'].forEach(id => {
        const el = $(id);
        if (el && !el.dataset.bound) {
            el.dataset.bound = '1';
            el.addEventListener('input', function() { if (this.value < 0) this.value = 0; calculerTotal(); });
        }
    });
    const rt = $('remise_type');
    if (rt && !rt.dataset.bound) { rt.dataset.bound = '1'; rt.addEventListener('change', calculerTotal); }
    const ap = $('assure_principal');
    if (ap && !ap.dataset.bound) { ap.dataset.bound = '1'; ap.addEventListener('change', toggleAssurePrincipal); }
    const clt = $('contact_livraison_type');
    if (clt && !clt.dataset.bound) { clt.dataset.bound = '1'; clt.addEventListener('change', updateContactFields); }
    const ag = $('agence');
    if (ag && !ag.dataset.bound) {
        ag.dataset.bound = '1';
        ag.addEventListener('change', loadMonturesForAgence);
    }
    setupPrescriptionSync('#newSaleModal');

    // ✅ Plus de setTimeout : l'agence est déjà remplie par loadCatalogueData
    if ($('agence')?.value) loadMonturesForAgence();
}

function setupPrescriptionSync(scopeSelector) {
    const scope = scopeSelector ? document.querySelector(scopeSelector) : document;
    if (!scope) return;
    const fields = ['od_sphere','od_cylindre','od_axe','od_add','og_sphere','og_cylindre','og_axe','og_add'];
    fields.forEach(name => {
        const selects = scope.querySelectorAll(`[name="${name}"]`);
        selects.forEach(s => {
            if (s.dataset.syncBound === '1') return;
            s.dataset.syncBound = '1';
            s.addEventListener('change', function() {
                selects.forEach(x => { if (x !== this) x.value = this.value; });
            });
        });
    });
}

function updateSaleStepDisplay() {
    const step = AppState.modals.sale.currentStep;
    for (let i = 1; i <= 4; i++) { const el = $(`step-${i}`); if (el) el.classList.toggle('active', i === step); }
    document.querySelectorAll('#newSaleModal .step').forEach((s, i) => s.classList.toggle('active', i + 1 === step));
    const prev = $('prevStepBtn'), next = $('nextStepBtn'), submit = $('submitBtn');
    if (prev) prev.style.display = step > 1 ? 'block' : 'none';
    if (next) next.style.display = step < 4 ? 'block' : 'none';
    if (submit) submit.style.display = step === 4 ? 'block' : 'none';
}

function prevSaleStep() { if (AppState.modals.sale.currentStep > 1) { AppState.modals.sale.currentStep--; updateSaleStepDisplay(); } }

function nextSaleStep() {
    if (AppState.modals.sale.currentStep === 1) {
        const nom = $('nom_complet')?.value.trim(), agence = $('agence')?.value;
        if (!nom) { highlightField('nom_complet'); showError('Le nom complet est obligatoire'); return; }
        if (!agence) { highlightField('agence'); showError('L\'agence est obligatoire'); return; }
    }
    if (AppState.modals.sale.currentStep === 3) {
        const net = parseFloat(($('net_a_payer_display')?.textContent || '').replace(/[^0-9.-]/g,'')) || 0;
        const ac = parseFloat($('acompte')?.value) || 0;
        if (ac > net) { highlightField('acompte'); showError(`L'acompte (${formatCurrency(ac)}) ne peut pas dépasser le Net à payer (${formatCurrency(net)})`); return; }
    }
    if (AppState.modals.sale.currentStep < 4) { AppState.modals.sale.currentStep++; updateSaleStepDisplay(); }
}

function highlightField(id) {
    const el = $(id) || $(id + '_input');
    if (el) {
        el.style.borderColor = '#dc3545';
        el.style.borderWidth = '2px';
        el.style.boxShadow = '0 0 0 3px rgba(220,53,69,0.25)';
        el.style.transition = 'all 0.3s ease';
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => { el.style.borderColor = ''; el.style.borderWidth = ''; el.style.boxShadow = ''; }, 3000);
    }
}

function calculerTotal() {
    const getVal = id => Math.max(0, parseFloat($(id)?.value) || 0);
    const monture = getVal('montant_monture'), verres = getVal('montant_verres'), brut = monture + verres;
    const remise = getVal('remise'), remiseType = $('remise_type')?.value || 'FCFA';
    const remiseVal = remiseType === '%' ? brut * remise / 100 : remise;
    const partAss = getVal('part_assurance');
    const net = Math.max(0, brut - remiseVal - partAss);
    const acompte = getVal('acompte');
    const reste = Math.max(0, net - acompte);
    const e1 = $('total_brut_display'); if (e1) e1.textContent = formatCurrency(brut);
    const e2 = $('net_a_payer_display'); if (e2) e2.textContent = formatCurrency(net);
    const e3 = $('reste_a_payer_display'); if (e3) e3.textContent = formatCurrency(reste);
    const tva = $('tva'); if (tva) tva.value = Math.round(monture * 18 / 118);
}

function toggleAssurePrincipal() {
    const val = $('assure_principal')?.value;
    const container = $('assure_principal_nom_container'), input = $('assure_principal_nom');
    if (!container || !input) return;
    if (val === 'oui' || val === 'non') {
        container.style.display = 'block';
        if (val === 'oui') {
            input.value = $('nom_complet')?.value || '';
            input.readOnly = true; input.style.backgroundColor = '#f0f0f0';
        } else { input.value = ''; input.readOnly = false; input.style.backgroundColor = ''; }
    } else container.style.display = 'none';
}

function updateContactFields() {
    const type = $('contact_livraison_type')?.value;
    const tel = $('telephone_contact'), addr = $('adresse_livraison');
    if (!tel || !addr) return;
    if (type === 'client') {
        const indic = $('indicatif')?.value || '';
        const num = $('numero')?.value || '';
        tel.value = (indic + ' ' + num).trim();
        tel.readOnly = true; tel.style.backgroundColor = '#f0f0f0';
        addr.value = $('agence')?.selectedOptions?.[0]?.text || '';
        addr.readOnly = true; addr.style.backgroundColor = '#f0f0f0';
    } else {
        tel.readOnly = false; tel.style.backgroundColor = '';
        addr.readOnly = false; addr.style.backgroundColor = '';
    }
}

async function loadCatalogueData(scope) {
    const root = scope === 'proforma' ? '#newProformaModal'
               : scope === 'sale'     ? '#newSaleModal'
               : null;
    const container = root ? document.querySelector(root) : null;
    if (!container) return false;

    const data = await fetchCatalogueData();
    if (!data) {
        showError('Catalogue indisponible, veuillez réessayer');
        return false;
    }

    const prefix = scope === 'proforma' ? 'proforma_' : '';
    const fields = {
        entreprise: data.entreprises,
        agence: data.agences,
        commercial: data.commerciaux,
        type_verre: data.typesVerre,
        gamme_verre: data.gammesVerre,
        assurance: data.assurances,
        compagnie: data.compagnies,
        clinique: data.cliniques,
        ophtalmo: data.ophtalmos
    };
    Object.entries(fields).forEach(([id, vals]) => {
        const target = container.querySelector(`#${prefix}${id}`) || container.querySelector(`#${id}`);
        if (target && Array.isArray(vals) && vals.length) {
            const current = target.value;   // préserve la sélection
            target.innerHTML = '<option value="">-- Choisir --</option>';
            vals.forEach(v => target.add(new Option(v, v)));
            if (current) target.value = current;
        }
    });

    // Prescriptions
    const fillSelects = (names, values) => {
        if (!Array.isArray(values) || !values.length) return;
        names.forEach(name => {
            container.querySelectorAll(`[name="${name}"]`).forEach(s => {
                const cur = s.value;
                s.innerHTML = '<option value="">--</option>';
                values.forEach(v => s.add(new Option(v, v)));
                if (cur) s.value = cur;
            });
        });
    };
    fillSelects(['od_sphere','og_sphere','od_cylindre','og_cylindre'], data.sphere);
    fillSelects(['od_axe','og_axe'], data.axe);
    fillSelects(['od_add','og_add'], data.add);

    return true;
}

async function loadMonturesForAgence() {
    const agence = $('agence')?.value, select = $('choix_monture');
    if (!agence || !select) return;
    select.disabled = true;
    select.innerHTML = '<option value="">-- Chargement --</option>';
    try {
        const data = await fetchMonturesData();
        if (!select.isConnected) return;
        if (data && Array.isArray(data.rows)) {
            select.innerHTML = '<option value="">-- Sélectionner --</option>';
            data.rows
                .filter(r => String(r[1] || '').toLowerCase() === agence.toLowerCase())
                .forEach(r => select.add(new Option(r[0] || '', r[0] || '')));
        } else {
            select.innerHTML = '<option value="">-- Aucune monture --</option>';
        }
    } catch (error) {
        console.error("Erreur montures:", error);
        if (select.isConnected) select.innerHTML = '<option value="">-- Erreur --</option>';
    } finally {
        if (select.isConnected) select.disabled = false;
    }
}

function resetSaleForm() {
    if (!confirm('Réinitialiser le formulaire ?')) return;
    $('client-form')?.reset();
    const today = new Date(); const delivery = new Date(today.setDate(today.getDate() + 15));
    const dl = $('date_livraison'); if (dl) dl.value = delivery.toISOString().split('T')[0];
    const cu = $('current_user'); if (cu) cu.value = AppState.user.nom;
    calculerTotal();
    AppState.modals.sale.currentStep = 1;
    updateSaleStepDisplay();
}

function collectSaleData() {
    const data = {};
    document.querySelectorAll('#client-form input, #client-form select, #client-form textarea').forEach(el => {
        if (el.name && !el.disabled) {
            if (el.tagName === 'SELECT' && el.style.display === 'none') {
                const inp = $(el.id + '_input');
                if (inp && inp.value) data[el.name] = inp.value;
                else data[el.name] = el.value;
            } else data[el.name] = el.value;
        }
    });
    ['entreprise','commercial','assurance','compagnie','clinique','ophtalmo'].forEach(f => {
        const inp = $(f + '_input');
        if (inp && inp.style.display === 'block' && inp.value) data[f] = inp.value;
    });
    data.total_brut = parseFloat(($('total_brut_display')?.textContent || '').replace(/[^0-9.-]/g,'')) || 0;
    data.net_a_payer = parseFloat(($('net_a_payer_display')?.textContent || '').replace(/[^0-9.-]/g,'')) || 0;
    data.reste_a_payer = parseFloat(($('reste_a_payer_display')?.textContent || '').replace(/[^0-9.-]/g,'')) || 0;
    data.token = sessionStorage.getItem('apiToken');
    return data;
}

function submitSaleForm() {
    if (!validateSaleForm()) return;
    showInfo('Traitement en cours...');
    const btn = $('submitBtn'); if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...'; }
    const data = collectSaleData(); data.utilisateur = AppState.user.nom; data.token = sessionStorage.getItem('apiToken');
    fetch(`${CONFIG.API_BASE}${CONFIG.ENDPOINTS.addCommande}`, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(() => {
        showSuccess('Vente enregistrée !');
        setTimeout(() => closeVente(), 1500);
    }).catch(error => {
        console.error('Erreur:', error);
        showError('Erreur lors de l\'envoi');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Ajouter'; }
    });
}

function validateSaleForm() {
    const nom = $('nom_complet')?.value.trim(), agence = $('agence')?.value;
    const net = parseFloat(($('net_a_payer_display')?.textContent || '').replace(/[^0-9.-]/g,'')) || 0;
    const ac = parseFloat($('acompte')?.value) || 0;
    if (!nom) { highlightField('nom_complet'); showError('Le nom complet est obligatoire'); AppState.modals.sale.currentStep = 1; updateSaleStepDisplay(); return false; }
    if (!agence) { highlightField('agence'); showError('L\'agence est obligatoire'); AppState.modals.sale.currentStep = 1; updateSaleStepDisplay(); return false; }
    if (ac > net) { highlightField('acompte'); showError(`L'acompte (${formatCurrency(ac)}) ne peut pas dépasser le Net à payer (${formatCurrency(net)})`); AppState.modals.sale.currentStep = 3; updateSaleStepDisplay(); return false; }
    return true;
}

function closeVente() { window.location.href = 'Accueil.html'; }
