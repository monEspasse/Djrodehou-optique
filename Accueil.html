                        <div><button type="button" class="btn btn-primary" id="proformaNextStepBtn">Suivant <i class="fas fa-arrow-right"></i></button><button type="button" class="btn btn-success" id="proformaSubmitBtn" style="display:none;"><i class="fas fa-file-pdf"></i> Générer PDF</button></div>
                    </div>
                </form>
            </div>
        </div>
    `;
}

async function initProformaModal() {
    AppState.modals.proforma.currentStep = 1;
    updateProformaStepDisplay();
    calculerProformaTotal();
    const userInput = $('proformauser');
    if (userInput) {
        userInput.defaultValue = AppState.user.nom || '';
        if (!userInput.value) userInput.value = AppState.user.nom || '';
    }

    // ✅ On attend le catalogue AVANT les events
    await loadCatalogueData('proforma');

    $('proformaPrevStepBtn') && ($('proformaPrevStepBtn').onclick = prevProformaStep);
    $('proformaNextStepBtn') && ($('proformaNextStepBtn').onclick = nextProformaStep);
    $('proformaResetButton') && ($('proformaResetButton').onclick = resetProformaForm);
    $('proformaSubmitBtn') && ($('proformaSubmitBtn').onclick = generateProformaPDF);
    ['proforma_montant_monture','proforma_montant_verres','proforma_remise'].forEach(id => {
        const el = $(id);
        if (el && !el.dataset.bound) {
            el.dataset.bound = '1';
            el.addEventListener('input', function() { if (this.value < 0) this.value = 0; calculerProformaTotal(); });
        }
    });
    const rt = $('proforma_remise_type');
    if (rt && !rt.dataset.bound) { rt.dataset.bound = '1'; rt.addEventListener('change', calculerProformaTotal); }
    setupPrescriptionSync('#newProformaModal');
}

function updateProformaStepDisplay() {
    const step = AppState.modals.proforma.currentStep;
    for (let i = 1; i <= 3; i++) { const el = $(`proforma-step-${i}`); if (el) el.classList.toggle('active', i === step); }
    document.querySelectorAll('#newProformaModal .step').forEach((s, i) => s.classList.toggle('active', i + 1 === step));
    const prev = $('proformaPrevStepBtn'), next = $('proformaNextStepBtn'), submit = $('proformaSubmitBtn');
    if (prev) prev.style.display = step > 1 ? 'block' : 'none';
    if (next) next.style.display = step < 3 ? 'block' : 'none';
    if (submit) submit.style.display = step === 3 ? 'block' : 'none';
}

function prevProformaStep() { if (AppState.modals.proforma.currentStep > 1) { AppState.modals.proforma.currentStep--; updateProformaStepDisplay(); } }

function nextProformaStep() {
    if (validateProformaStep(AppState.modals.proforma.currentStep) && AppState.modals.proforma.currentStep < 3) {
        AppState.modals.proforma.currentStep++;
        updateProformaStepDisplay();
    }
}

function validateProformaStep(step) {
    if (step === 1) {
        const required = ['proforma_nom_complet','proforma_agence'];
        for (const id of required) {
            if (!$(id)?.value) {
                const el = $(id);
                if (el) { el.style.borderColor = '#dc3545'; el.style.borderWidth = '2px'; setTimeout(() => { el.style.borderColor = ''; el.style.borderWidth = ''; }, 2000); }
                showError('Remplissez tous les champs obligatoires');
                return false;
            }
        }
    }
    if (step === 2) {
        if (!$('proforma_type_verre')?.value) {
            const el = $('proforma_type_verre');
            if (el) { el.style.borderColor = '#dc3545'; el.style.borderWidth = '2px'; setTimeout(() => { el.style.borderColor = ''; el.style.borderWidth = ''; }, 2000); }
            showError('Remplissez tous les champs obligatoires');
            return false;
        }
    }
    return true;
}

function calculerProformaTotal() {
    const getVal = id => Math.max(0, parseFloat($(id)?.value) || 0);
    const monture = getVal('proforma_montant_monture'), verres = getVal('proforma_montant_verres'), brut = monture + verres;
    const remise = getVal('proforma_remise'), remiseType = $('proforma_remise_type')?.value || 'FCFA';
    const remiseVal = remiseType === '%' ? brut * remise / 100 : remise;
    const net = Math.max(0, brut - remiseVal);
    const e1 = $('proforma_total_brut_display'); if (e1) e1.textContent = formatCurrency(brut);
    const e2 = $('proforma_net_a_payer_display'); if (e2) e2.textContent = formatCurrency(net);
}

function toggleCostDetails() {
    const content = $('costDetailsContent'), icon = $('costDetailsIcon'), header = document.querySelector('.cost-details-header span');
    if (!content || !icon || !header) return;
    if (content.style.display === 'block') {
        content.style.display = 'none';
        icon.style.transform = 'rotate(0deg)';
        header.textContent = 'Afficher détails des coûts';
    } else {
        content.style.display = 'block';
        icon.style.transform = 'rotate(180deg)';
        header.textContent = 'Masquer détails des coûts';
    }
}

function resetProformaForm() {
    if (!confirm('Réinitialiser le formulaire ?')) return;
    $('proforma-form')?.reset();
    const indic = $('proforma_indicatif'); if (indic) indic.value = '+229';
    document.querySelectorAll('#proforma-form input[type="number"]').forEach(i => i.value = '0');
    const pu = $('proformauser'); if (pu) pu.value = AppState.user.nom || '';
    calculerProformaTotal();
    AppState.modals.proforma.currentStep = 1;
    updateProformaStepDisplay();
}

function collectProformaData() {
    const data = {};
    document.querySelectorAll('#proforma-form input, #proforma-form select').forEach(el => {
        if (el.name && !el.disabled) data[el.name] = el.value;
    });
    const indic = $('proforma_indicatif')?.value || '';
    const num = $('proforma_telephone')?.value || '';
    data.contact = (indic + ' ' + num).trim();
    return data;
}

/* ---- Retry automatique sur la génération PDF ---- */
async function generateProformaPDF() {
    if (!validateProformaStep(1) || !validateProformaStep(2)) {
        AppState.modals.proforma.currentStep = 1;
        updateProformaStepDisplay();
        return;
    }
    const btn = $('proformaSubmitBtn');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Génération...';
    btn.disabled = true;
    const data = collectProformaData(); data.token = sessionStorage.getItem('apiToken');
    try {
        await fetch(`${CONFIG.API_BASE}?action=addproforma`, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ formData: data, token: data.token })
        });
        let attempts = 0;
        const maxAttempts = 6;
        const tryFetch = async () => {
            attempts++;
            let ok = false;
            try { ok = await checkAndOpenProformaPDF(); }
            catch (e) { console.error('Erreur checkAndOpenProformaPDF:', e); }
            if (!ok && attempts < maxAttempts) {
                setTimeout(tryFetch, 1500);
            } else {
                if (!ok) showError("Le PDF n'a pas pu être récupéré après plusieurs tentatives.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };
        setTimeout(tryFetch, 2500);
    } catch (error) {
        console.error("Erreur envoi:", error);
        showError("Erreur lors de l'envoi des données");
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

async function checkAndOpenProformaPDF() {
    try {
        const token = sessionStorage.getItem('apiToken');
        const url = `${CONFIG.API_BASE}?action=getlastpdf&token=${encodeURIComponent(token)}`;
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Erreur HTTP! statut: ${response.status}`);
        const result = await response.json();
        const isSuccess = result.succès || result.success;
        const messageText = result.message || "";
        let pdfUrl = null;
        if (isSuccess && result.data && result.data.pdfUrl) pdfUrl = result.data.pdfUrl;
        else if (messageText.includes("en cours de génération")) return false;
        else if (isSuccess === false) { showError("Erreur lors de la génération du PDF: " + messageText); return true; }
        else { showError("Erreur inattendue lors de la génération du PDF."); return true; }
        if (pdfUrl) {
            closeModal();
            window.open(pdfUrl, '_blank');
            showSuccess("PDF généré avec succès! Ouverture dans un nouvel onglet.");
            return true;
        }
        return false;
    } catch (error) {
        console.error("❌ Erreur ouverture PDF:", error);
        showError("Erreur lors de l'ouverture du PDF: " + error.message);
        return true;
    }
}

/* ============================================================
   ANALYTICS
   ============================================================ */
class SalesAnalytics {
    constructor() {
        this.chart = null; this.data = []; this.loading = false;
        this.agencesList = new Set();
        this.userAgence = sessionStorage.getItem("agence") || localStorage.getItem("agence") || "Tous";
        this.userAnalyse = sessionStorage.getItem("analyse") || localStorage.getItem("analyse") || "Tous";
    }
    getAgencyColor(agency) {
        let hash = 0;
        for (let i = 0; i < agency.length; i++) { hash = ((hash << 5) - hash) + agency.charCodeAt(i); hash = hash & hash; }
        const schemes = [
            h => `hsl(${210 + (h % 30)}, 70%, 55%)`,
            h => `hsl(${140 + (h % 40)}, 65%, 50%)`,
            h => `hsl(${30 + (h % 40)}, 75%, 55%)`,
            h => `hsl(${270 + (h % 40)}, 65%, 60%)`,
            h => `hsl(${350 + (h % 30)}, 70%, 60%)`,
            h => `hsl(${180 + (h % 40)}, 70%, 50%)`,
            h => `hsl(${50 + (h % 30)}, 75%, 55%)`,
            h => `hsl(${300 + (h % 40)}, 65%, 60%)`
        ];
        const si = Math.abs(hash) % schemes.length;
        return schemes[si](Math.abs(hash >> 8) % 60);
    }
    formatFCFA(amount) {
        const n = Number(amount);
        if (!isFinite(n)) return '0 FCFA';
        return Math.round(n).toLocaleString('fr-FR') + ' FCFA';
    }
    filterDataByUser(data) {
        return data.filter(item => {
            if (this.userAgence && this.userAgence !== 'Tous' && this.userAgence !== 'null' && this.userAgence !== 'undefined') {
                if ((item.Agence || '') !== this.userAgence) return false;
            }
            if (this.userAnalyse && this.userAnalyse !== 'Tous' && this.userAnalyse !== 'null' && this.userAnalyse !== 'undefined') {
                if ((item.Commercial || '') !== this.userAnalyse) return false;
            }
            return true;
        });
    }
    async fetchSalesData() {
        this.showLoader(true);
        try {
            const token = sessionStorage.getItem('apiToken');
            if (!token) throw new Error("Token manquant - Veuillez vous reconnecter");

            const resp = await safeFetch(
                `${CONFIG.API_BASE}?action=dataclient&token=${encodeURIComponent(token)}`
            );
            const result = await resp.json();

            if (!result.success) throw new Error(result.message || "Erreur lors du chargement");
            if (!result.data || !result.data.headers || !result.data.rows) {
                throw new Error("Réponse invalide du serveur");
            }

            const headers = result.data.headers;
            this.data = result.data.rows.map(row => {
                const obj = {};
                headers.forEach((h, i) => obj[h] = row[i]);
                return obj;
            });
            return this.data;
        } catch (error) {
            const wasAuth = handleApiError(error, 'Ventes');
            if (!wasAuth) {
                this.showNoDataMessage("Impossible de charger les ventes. Vérifiez votre connexion.");
            }
            return [];
        } finally {
            this.showLoader(false);
        }
    }
    groupDataByMonth(data) {
        const monthly = new Map(); this.agencesList.clear();
        data.forEach(item => {
            if (!item['Date Enregistrement'] || !item['Montant TTC']) return;
            const date = new Date(item['Date Enregistrement']);
            if (isNaN(date.getTime())) return;
            const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
            const label = date.toLocaleDateString('fr-FR', { month: 'short', year: 'numeric' });
            const amount = parseFloat(item['Montant TTC']) || 0;
            const agence = item['Agence'] || 'Non spécifié';
            if (!monthly.has(key)) monthly.set(key, { label, total: 0, byAgency: new Map(), date });
            const d = monthly.get(key); d.total += amount;
            const prev = d.byAgency.get(agence) || 0; d.byAgency.set(agence, prev + amount);
            this.agencesList.add(agence);
        });
        return monthly;
    }
    getLast12Months(monthly) {
        return Array.from(monthly.entries()).sort((a, b) => a[1].date - b[1].date).slice(-12);
    }
    prepareDatasets(monthly) {
        const months = this.getLast12Months(monthly);
        if (months.length === 0) return { labels: [], datasets: [] };
        const labels = months.map(([_, d]) => d.label);
        const totalDs = {
            label: 'Toutes ventes',
            data: months.map(([_, d]) => d.total),
            borderColor: '#4f46e5',
            backgroundColor: 'rgba(79,70,229,0.08)',
            borderWidth: 3, tension: 0.4,
            pointRadius: 4, pointHoverRadius: 6,
            pointBackgroundColor: '#4f46e5', pointBorderColor: '#fff',
            fill: true
        };
        const datasets = [totalDs];
        let agencies = Array.from(this.agencesList).sort();
        if (this.userAgence && this.userAgence !== 'Tous' && this.userAgence !== 'null' && this.userAgence !== 'undefined') agencies = [this.userAgence];
        agencies.forEach((agency) => {
            const data = months.map(([_, m]) => m.byAgency.get(agency) || 0);
            if (data.some(v => v > 0)) {
                const color = this.getAgencyColor(agency);
                datasets.push({
                    label: agency, data,
                    borderColor: color, backgroundColor: 'transparent',
                    borderWidth: 2, tension: 0.4,
                    pointRadius: 3, pointHoverRadius: 5,
                    pointBackgroundColor: color, pointBorderColor: '#fff',
                    fill: false
                });
            }
        });
        return { labels, datasets };
    }
    updateChart(monthly) {
        const canvas = document.getElementById('salesChart');
        if (!canvas) return;
        const { labels, datasets } = this.prepareDatasets(monthly);
        if (labels.length === 0) { this.showNoDataMessage("Aucune donnée disponible pour la période sélectionnée"); return; }
        if (this.chart) this.chart.destroy();
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const gridColor = isDark ? 'rgba(148,163,184,0.1)' : 'rgba(0,0,0,0.05)';
        const textColor = isDark ? '#94a3b8' : '#64748b';
        this.chart = new Chart(canvas, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: ctx => {
                                let label = ctx.dataset.label || '';
                                if (label) label += ': ';
                                const v = ctx.raw || 0;
                                label += Math.round(v).toLocaleString('fr-FR') + ' FCFA';
                                return label;
                            }
                        },
                        backgroundColor: 'rgba(15,23,42,0.95)',
                        titleColor: '#fff', bodyColor: '#fff',
                        borderColor: '#4f46e5', borderWidth: 1, padding: 12, cornerRadius: 10
                    },
                    legend: {
                        position: 'top',
                        labels: { usePointStyle: true, boxWidth: 8, font: { size: 11, weight: '500' }, padding: 16, color: textColor }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: gridColor },
                        title: { display: true, text: 'Montant TTC (FCFA)', font: { weight: '600', size: 11 }, color: textColor },
                        ticks: { callback: v => Math.round(v).toLocaleString('fr-FR'), maxTicksLimit: 6, color: textColor, font: { size: 10 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { maxRotation: 45, minRotation: 45, color: textColor, font: { size: 10 } }
                    }
                },
                elements: { line: { fill: false, tension: 0.4 }, point: { radius: 3, hoverRadius: 6, hitRadius: 10 } }
            }
        });
    }
    showLoader(show) {
        const card = document.querySelector('.chart-card');
        if (!card) return;
        let loader = card.querySelector('.chart-loader');
        if (show) {
            if (!loader) {
                loader = document.createElement('div');
                loader.className = 'chart-loader';
                loader.innerHTML = `<div class="spinner"></div><p style="color:var(--text-muted);font-size:.85rem;">Chargement des données…</p>`;
                card.style.position = 'relative';
                card.appendChild(loader);
            }
            loader.style.display = 'flex';
            const canvas = card.querySelector('#salesChart');
            if (canvas) canvas.style.opacity = '0.4';
        } else {
            if (loader) loader.style.display = 'none';
            const canvas = card.querySelector('#salesChart');
            if (canvas) canvas.style.opacity = '1';
        }
    }
    showNoDataMessage(msg) {
        const card = document.querySelector('.chart-card');
        if (!card) return;
        let el = card.querySelector('.no-data-message');
        if (!el) {
            el = document.createElement('div');
            el.className = 'no-data-message';
            el.style.cssText = 'position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r-xl);z-index:10;text-align:center;padding:var(--s-6);';
            card.style.position = 'relative';
            card.appendChild(el);
        }
        el.innerHTML = `<i class="fas fa-chart-line" style="font-size:2.5rem;color:var(--text-subtle);margin-bottom:var(--s-3);"></i><p style="color:var(--text-muted);font-size:.9rem;">${escapeHtml(msg || "Aucune donnée disponible")}</p><button class="page-btn" style="margin-top:var(--s-4);"><i class="fas fa-sync-alt"></i> Réessayer</button>`;
        el.style.display = 'flex';
        el.querySelector('.page-btn')?.addEventListener('click', () => { el.style.display = 'none'; this.loadAndRender(); });
        const canvas = card.querySelector('#salesChart');
        if (canvas) canvas.style.opacity = '0.2';
    }
    async loadAndRender() {
        this.userAgence = sessionStorage.getItem("agence") || localStorage.getItem("agence") || "Tous";
        this.userAnalyse = sessionStorage.getItem("analyse") || localStorage.getItem("analyse") || "Tous";
        const raw = await this.fetchSalesData();
        if (!raw || raw.length === 0) { this.showNoDataMessage("Aucune donnée disponible"); return; }
        const filtered = this.filterDataByUser(raw);
        if (filtered.length === 0) { this.showNoDataMessage(`Aucune donnée pour les filtres: Agence=${this.userAgence}, Commercial=${this.userAnalyse}`); return; }
        const monthly = this.groupDataByMonth(filtered);
        if (monthly.size === 0) { this.showNoDataMessage("Aucune donnée de vente valide"); return; }
        this.updateChart(monthly);
        this.displaySummary(monthly);
    }
    displaySummary(monthly) {
        const months = this.getLast12Months(monthly);
        if (months.length === 0) return;
        const total = months.reduce((s, [_, d]) => s + d.total, 0);
        const avg = total / months.length;
        let best = months[0];
        for (let i = 1; i < months.length; i++) { if (months[i][1].total > best[1].total) best = months[i]; }
        const cur = months[months.length - 1];
        let div = document.querySelector('.sales-summary');
        if (!div) {
            const card = document.querySelector('.chart-card');
            if (card) {
                div = document.createElement('div');
                div.className = 'sales-summary';
                card.appendChild(div);
            }
        }
        if (div) {
            div.innerHTML = `
                <div class="summary-item"><div class="lbl">Total 12 mois</div><div class="val">${this.formatFCFA(total)}</div></div>
                <div class="summary-item"><div class="lbl">Moyenne</div><div class="val" style="color:var(--brand-600);">${this.formatFCFA(avg)}</div></div>
                <div class="summary-item"><div class="lbl">Mois en cours</div><div class="val" style="color:var(--warning);">${this.formatFCFA(cur[1]?.total || 0)}</div></div>
                <div class="summary-item"><div class="lbl">Meilleur mois</div><div class="val" style="color:var(--success);">${this.formatFCFA(best[1]?.total || 0)}</div></div>
            `;
        }
    }
}

function initTheme() {
    const saved = localStorage.getItem('visiopro-theme') || 'auto';
    applyTheme(saved);
    const tt = $('themeToggle');
    if (tt && !tt.dataset.bound) {
        tt.dataset.bound = '1';
        tt.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme') || 'light';
            const next = cur === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('visiopro-theme', next);
            const analytics = window.__visioproAnalytics;
            if (analytics && analytics.chart) {
                analytics.chart.destroy();
                analytics.chart = null;
                analytics.loadAndRender();
            }
        });
    }
}
function applyTheme(theme) {
    if (theme === 'auto') {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = prefersDark ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
    const icon = $('themeToggle')?.querySelector('i');
    if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

function initPalette() {
    const overlay = $('paletteOverlay');
    const input = $('paletteInput');
    const list = $('paletteList');
    if (!overlay || !input || !list) return;
    let selected = 0;
    let filtered = PaletteCommands;

    const render = () => {
        if (filtered.length === 0) {
            list.innerHTML = `<div class="palette-empty">Aucune commande trouvée</div>`;
            return;
        }
        list.innerHTML = filtered.map((c, i) => `
            <div class="palette-item ${i === selected ? 'selected' : ''}" data-idx="${i}">
                <div class="palette-item-icon"><i class="fas ${c.icon}"></i></div>
                <div class="palette-item-label">${escapeHtml(c.label)}</div>
                <div class="palette-item-hint">${escapeHtml(c.hint)}</div>
            </div>
        `).join('');
        list.querySelectorAll('.palette-item').forEach(el => {
            el.addEventListener('click', () => { const i = +el.dataset.idx; filtered[i].action(); closePalette(); });
        });
    };

    const filter = (q) => {
        q = q.toLowerCase().trim();
        filtered = !q ? PaletteCommands : PaletteCommands.filter(c => c.label.toLowerCase().includes(q) || c.id.includes(q));
        selected = 0;
        render();
    };

    const openPalette = () => {
        overlay.classList.add('active');
        input.value = '';
        filter('');
        setTimeout(() => input.focus(), 50);
    };
    const closePalette = () => { overlay.classList.remove('active'); };

    const st = $('searchTrigger');
    if (st && !st.dataset.bound) { st.dataset.bound = '1'; st.addEventListener('click', openPalette); }
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePalette(); });

    input.addEventListener('input', (e) => filter(e.target.value));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); selected = Math.min(selected + 1, filtered.length - 1); render(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); selected = Math.max(selected - 1, 0); render(); }
        else if (e.key === 'Enter') { e.preventDefault(); if (filtered[selected]) { filtered[selected].action(); closePalette(); } }
        else if (e.key === 'Escape') closePalette();
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
            closePalette();
            $('sidebar')?.classList.remove('open');
            $('sidebarBackdrop')?.classList.remove('open');
        }
    });
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function initSidebar() {
    const app = $('app');
    const sidebar = $('sidebar');
    const backdrop = $('sidebarBackdrop');
    const btnMenu = $('btnMenu');
    if (!app || !sidebar || !btnMenu) return;
    btnMenu.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('open');
            backdrop?.classList.toggle('open');
        } else {
            app.classList.toggle('sidebar-collapsed');
            localStorage.setItem('visiopro-sidebar-collapsed', app.classList.contains('sidebar-collapsed'));
        }
    });
    backdrop?.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); });
    if (localStorage.getItem('visiopro-sidebar-collapsed') === 'true' && window.innerWidth > 768) {
        app.classList.add('sidebar-collapsed');
    }
}

/* ============================================================
   INITIALISATION
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    initSidebar();
    initPalette();
    initAuth();
    loadClientsFromScript();

    $('notificationBadge')?.addEventListener('click', openNotificationModal);
    $('searchInput')?.addEventListener('input', debounce(applySearchFilter, 250));
    $('firstPage')?.addEventListener('click', goToFirstPage);
    $('prevPage')?.addEventListener('click', goToPrevPage);
    $('nextPage')?.addEventListener('click', goToNextPage);
    $('lastPage')?.addEventListener('click', goToLastPage);
    $('itemsPerPageSelect')?.addEventListener('change', (e) => {
        AppState.clients.itemsPerPage = parseInt(e.target.value, 10) || 10;
        AppState.clients.currentPage = 1;
        localStorage.setItem('visiopro-items-per-page', e.target.value);
        updateTableAndPagination();
    });

    // Persistance lignes par page
    const savedPerPage = localStorage.getItem('visiopro-items-per-page');
    if (savedPerPage) {
        const sel = $('itemsPerPageSelect');
        if (sel) { sel.value = savedPerPage; AppState.clients.itemsPerPage = parseInt(savedPerPage, 10) || 10; }
    }

    // Analytics
    const canvas = document.getElementById('salesChart');
    if (canvas) {
        setTimeout(() => {
            const analytics = new SalesAnalytics();
            window.__visioproAnalytics = analytics;
            analytics.loadAndRender();
            AppState.analyticsInterval = setInterval(() => analytics.loadAndRender(), 5 * 60 * 1000);
        }, 500);
    }
});

window.addEventListener('beforeunload', () => {
    stopNotificationCarousel();
    if (AppState.analyticsInterval) clearInterval(AppState.analyticsInterval);
    if (inactivityTimer) clearTimeout(inactivityTimer);
});
</script>
