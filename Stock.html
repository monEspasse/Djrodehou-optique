<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4361ee">
    <title>VisioPro</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
/* ============================================================
   1. DESIGN TOKENS (repris du code 1)
   ============================================================ */
:root {
    --brand-50: #eef2ff; --brand-100: #e0e7ff; --brand-200: #c7d2fe;
    --brand-300: #a5b4fc; --brand-400: #818cf8; --brand-500: #6366f1;
    --brand-600: #4f46e5; --brand-700: #4338ca; --brand-800: #3730a3; --brand-900: #312e81;

    --n-0: #ffffff; --n-50: #f8fafc; --n-100: #f1f5f9; --n-200: #e2e8f0;
    --n-300: #cbd5e1; --n-400: #94a3b8; --n-500: #64748b; --n-600: #475569;
    --n-700: #334155; --n-800: #1e293b; --n-900: #0f172a; --n-950: #020617;

    --success: #10b981; --success-bg: #d1fae5;
    --warning: #f59e0b; --warning-bg: #fef3c7;
    --danger:  #ef4444; --danger-bg:  #fee2e2;
    --info:    #3b82f6; --info-bg:    #dbeafe;

    --violet: #8b5cf6; --pink: #ec4899; --cyan: #06b6d4; --lime: #84cc16;

    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;

    --sh-xs: 0 1px 2px rgba(15,23,42,.05);
    --sh-sm: 0 2px 4px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --sh-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --sh-lg: 0 12px 24px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.05);
    --sh-xl: 0 24px 48px rgba(15,23,42,.14), 0 8px 16px rgba(15,23,42,.06);
    --sh-brand: 0 8px 24px rgba(79,70,229,.25);

    --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --r-xl: 20px; --r-2xl: 24px; --r-3xl: 32px; --r-full: 9999px;

    --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem;
    --s-5: 1.25rem; --s-6: 1.5rem; --s-8: 2rem; --s-10: 2.5rem;
    --s-12: 3rem; --s-16: 4rem;

    --ease: cubic-bezier(.4,0,.2,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --dur-fast: 150ms;
    --dur: 250ms;
    --dur-slow: 400ms;

    --sidebar-w: 264px;
    --sidebar-w-collapsed: 72px;
    --header-h: 64px;
}

html[data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111a2e;
    --surface-2: #0f172a;
    --surface-3: #1e293b;
    --border: #1e293b;
    --border-strong: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --sh-xs: 0 1px 2px rgba(0,0,0,.3);
    --sh-sm: 0 2px 4px rgba(0,0,0,.4);
    --sh-md: 0 4px 12px rgba(0,0,0,.5);
    --sh-lg: 0 12px 24px rgba(0,0,0,.55);
    --sh-xl: 0 24px 48px rgba(0,0,0,.6);
}

/* ============================================================
   2. RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }

:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; border-radius: var(--r-xs); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: var(--r-full);
    border: 2px solid transparent;
    background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--n-400); background-clip: content-box; }

.hidden { display: none !important; }

/* ============================================================
   3. APP SHELL
   ============================================================ */
.app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-areas: "sidebar header" "sidebar main";
    min-height: 100vh;
    transition: grid-template-columns var(--dur) var(--ease);
}
.app.sidebar-collapsed { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

/* ============================================================
   4. SIDEBAR (identique au code 1)
   ============================================================ */
.sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 50;
    transition: all var(--dur) var(--ease);
}
.sidebar-brand {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-4);
    height: var(--header-h);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    transition: padding var(--dur) var(--ease);
}
.brand-logo {
    width: 36px; height: 36px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--brand-500), var(--violet));
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 1rem;
    flex-shrink: 0;
    box-shadow: var(--sh-brand);
    transition: transform var(--dur) var(--ease-spring);
    overflow: hidden;
}
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-logo:hover { transform: rotate(-6deg) scale(1.05); }
.brand-text {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: -.02em;
    white-space: nowrap;
    background: linear-gradient(135deg, var(--brand-600), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: opacity var(--dur) var(--ease);
}
.app.sidebar-collapsed .brand-text { opacity: 0; pointer-events: none; }

.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--s-3) var(--s-2);
    display: flex;
    flex-direction: column;
    gap: var(--s-1);
}
.nav-section-label {
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-subtle);
    padding: var(--s-3) var(--s-3) var(--s-2);
    white-space: nowrap;
    transition: opacity var(--dur) var(--ease);
}
.app.sidebar-collapsed .nav-section-label { opacity: 0; }

.nav-item {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-3);
    border-radius: var(--r-md);
    color: var(--text-muted);
    font-size: .875rem;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: all var(--dur-fast) var(--ease);
    white-space: nowrap;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
}
.nav-item:hover { background: var(--surface-3); color: var(--text); transform: translateX(2px); }
.nav-item.active {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    box-shadow: var(--sh-brand);
}
.nav-item.active::before {
    content: '';
    position: absolute;
    left: -8px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 20px;
    background: var(--brand-500);
    border-radius: var(--r-full);
}
.nav-icon { width: 20px; height: 20px; display: grid; place-items: center; font-size: .95rem; flex-shrink: 0; }
.nav-label { flex: 1; transition: opacity var(--dur) var(--ease); }
.app.sidebar-collapsed .nav-label { opacity: 0; pointer-events: none; }
.nav-badge {
    padding: 2px 6px;
    border-radius: var(--r-full);
    font-size: .65rem;
    font-weight: 700;
    background: var(--success);
    color: #fff;
}
.app.sidebar-collapsed .nav-badge { display: none; }

.nav-sub {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur) var(--ease);
    margin-left: var(--s-6);
    border-left: 1px solid var(--border);
    padding-left: var(--s-3);
}
.nav-item.open + .nav-sub { grid-template-rows: 1fr; }
.nav-sub-inner { overflow: hidden; display: flex; flex-direction: column; gap: 2px; padding: var(--s-1) 0; }
.nav-sub a {
    display: flex; align-items: center; gap: var(--s-2);
    padding: var(--s-2) var(--s-3);
    border-radius: var(--r-sm);
    font-size: .8rem;
    color: var(--text-muted);
    transition: all var(--dur-fast) var(--ease);
}
.nav-sub a:hover { background: var(--surface-3); color: var(--brand-600); }
.nav-sub a i { width: 14px; font-size: .7rem; color: var(--brand-400); }
.app.sidebar-collapsed .nav-sub { display: none; }

.sidebar-footer {
    flex-shrink: 0;
    padding: var(--s-3);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--s-2);
}
.user-chip {
    flex: 1;
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-2);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
    min-width: 0;
}
.user-chip:hover { background: var(--surface-3); }
.user-avatar { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
.user-avatar img {
    width: 100%; height: 100%;
    border-radius: var(--r-full);
    object-fit: cover;
    border: 2px solid var(--surface);
    box-shadow: var(--sh-sm);
}
.user-status {
    position: absolute;
    bottom: -2px; right: -2px;
    width: 12px; height: 12px;
    border-radius: var(--r-full);
    background: var(--success);
    border: 2px solid var(--surface);
    animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
    0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.5); }
    50% { box-shadow: 0 0 0 4px rgba(16,185,129,0); }
}
.user-meta { min-width: 0; flex: 1; transition: opacity var(--dur) var(--ease); }
.app.sidebar-collapsed .user-meta { opacity: 0; pointer-events: none; }
.user-name { font-size: .85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: .7rem; color: var(--text-subtle); display: flex; align-items: center; gap: 4px; }
.user-role i { font-size: .5rem; color: var(--success); }
.btn-icon {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    transition: all var(--dur-fast) var(--ease);
    flex-shrink: 0;
}
.btn-icon:hover { background: var(--surface-3); color: var(--danger); }

/* ============================================================
   5. HEADER
   ============================================================ */
.header {
    grid-area: header;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: 0 var(--s-4);
    position: sticky; top: 0;
    z-index: 40;
}
.btn-menu {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    transition: all var(--dur-fast) var(--ease);
}
.btn-menu:hover { background: var(--surface-3); color: var(--text); }

.breadcrumb { display: flex; align-items: center; gap: var(--s-2); font-size: .85rem; color: var(--text-muted); }
.breadcrumb .current { color: var(--text); font-weight: 600; }
.breadcrumb i { font-size: .6rem; opacity: .5; }
.header-spacer { flex: 1; }

.search-trigger {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-2) var(--s-4);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    color: var(--text-muted);
    font-size: .85rem;
    min-width: 280px;
    transition: all var(--dur-fast) var(--ease);
}
.search-trigger:hover { background: var(--surface); border-color: var(--brand-300); box-shadow: var(--sh-sm); }
.search-trigger kbd {
    margin-left: auto;
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xs);
    font-size: .7rem;
    font-family: inherit;
    color: var(--text-subtle);
}

.header-actions { display: flex; align-items: center; gap: var(--s-1); }
.btn-header {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-muted);
    position: relative;
    transition: all var(--dur-fast) var(--ease);
}
.btn-header:hover { background: var(--surface-3); color: var(--text); }

/* ============================================================
   6. MAIN
   ============================================================ */
.main {
    grid-area: main;
    padding: var(--s-6);
    overflow-y: auto;
    overflow-x: hidden;
    max-height: calc(100vh - var(--header-h));
}
@media (min-width: 1400px) { .main { padding: var(--s-8); } }

.page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--s-4);
    margin-bottom: var(--s-6);
    flex-wrap: wrap;
}
.page-title {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, var(--text), var(--brand-600));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.page-subtitle { font-size: .85rem; color: var(--text-muted); margin-top: var(--s-1); }

/* ============================================================
   7. SECTIONS
   ============================================================ */
.section { display: none; }
.section.active { display: block; animation: fadeUp .3s var(--ease); }
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.section-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--s-4);
    margin-bottom: var(--s-5);
    flex-wrap: wrap;
}
.section-title {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--text);
    margin-bottom: var(--s-1);
}
.section-sub { font-size: .8rem; color: var(--text-muted); }
.section-actions { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }

/* ============================================================
   8. KPI CARDS
   ============================================================ */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--s-3);
    margin-bottom: var(--s-5);
}
.kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: var(--s-4);
    box-shadow: var(--sh-sm);
    transition: all var(--dur) var(--ease);
    position: relative;
    overflow: hidden;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
.kpi-label {
    font-size: .72rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: var(--s-3);
    display: flex;
    align-items: center;
    gap: var(--s-2);
}
.kpi-icon {
    width: 26px; height: 26px;
    border-radius: var(--r-sm);
    display: grid; place-items: center;
    font-size: .7rem;
    flex-shrink: 0;
}
.kpi-value {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--text);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}
.kpi-unit {
    font-size: .7rem;
    color: var(--text-subtle);
    margin-left: .25rem;
    font-weight: 500;
}

/* ============================================================
   9. TOOLBAR / FILTRES
   ============================================================ */
.toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: var(--s-3) var(--s-4);
    margin-bottom: var(--s-4);
    display: flex;
    gap: var(--s-3);
    align-items: center;
    box-shadow: var(--sh-sm);
    flex-wrap: wrap;
}
.search-wrap { flex: 1; min-width: 180px; position: relative; }
.search-wrap i {
    position: absolute; left: var(--s-3); top: 50%;
    transform: translateY(-50%);
    color: var(--text-subtle);
    font-size: .8rem;
    pointer-events: none;
}
.search-input {
    width: 100%;
    padding: var(--s-2) var(--s-3) var(--s-2) 34px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    font-size: .85rem;
    transition: all var(--dur-fast) var(--ease);
}
.search-input:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--brand-400);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
}
.search-input::placeholder { color: var(--text-subtle); }

.filters-row { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }

.filter-chip {
    display: flex; align-items: center; gap: var(--s-1);
    padding: 0 var(--s-1) 0 var(--s-3);
    height: 32px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    font-size: .78rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease);
    white-space: nowrap;
    position: relative;
    user-select: none;
}
.filter-chip:hover { border-color: var(--border-strong); background: var(--surface); color: var(--text); }
.filter-chip.active {
    background: var(--brand-50);
    border-color: var(--brand-300);
    color: var(--brand-700);
}
html[data-theme="dark"] .filter-chip.active { background: rgba(99,102,241,.15); color: var(--brand-300); }
.chip-label { font-weight: 500; }
.chip-val {
    font-weight: 700;
    font-size: .76rem;
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
}
.filter-chip.active .chip-val { display: inline; }
.chip-caret {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: var(--r-full);
    font-size: .65rem;
    color: var(--text-subtle);
    flex-shrink: 0;
    transition: transform var(--dur-fast) var(--ease);
}
.filter-chip.active .chip-caret { color: var(--brand-600); transform: rotate(180deg); }

.chip-drop {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: var(--s-1);
    z-index: 200;
    display: none;
    box-shadow: var(--sh-lg);
}
.chip-drop.open, .chip-drop[style*="display: block"] { display: block !important; animation: fadeIn var(--dur-fast) var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.drop-item {
    display: flex;
    align-items: center;
    gap: var(--s-2);
    padding: var(--s-2) var(--s-3);
    border-radius: var(--r-md);
    font-size: .82rem;
    cursor: pointer;
    color: var(--text);
    transition: background var(--dur-fast) var(--ease);
}
.drop-item:hover { background: var(--surface-3); }
.drop-item.sel { background: var(--brand-50); color: var(--brand-700); font-weight: 600; }
html[data-theme="dark"] .drop-item.sel { background: rgba(99,102,241,.15); color: var(--brand-300); }
.drop-item .di-check { margin-left: auto; font-size: .7rem; display: none; }
.drop-item.sel .di-check { display: inline; }
.drop-sep { height: 1px; background: var(--border); margin: var(--s-1) var(--s-2); }

.result-count {
    font-size: .79rem;
    color: var(--text-subtle);
    white-space: nowrap;
    margin-left: auto;
}

/* ============================================================
   10. TABLE
   ============================================================ */
.table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: var(--sh-sm);
}
.table-scroll {
    max-height: 540px;
    overflow-y: auto;
    overflow-x: auto;
}
.data-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
    font-size: .875rem;
}
.data-table thead {
    position: sticky; top: 0;
    background: var(--surface-2);
    z-index: 5;
    backdrop-filter: blur(8px);
}
.data-table th {
    padding: var(--s-3) var(--s-4);
    text-align: left;
    font-weight: 700;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}
.data-table th.sortable { cursor: pointer; user-select: none; transition: color var(--dur-fast) var(--ease); }
.data-table th.sortable:hover { color: var(--brand-600); }
.data-table th.sortable::after {
    content: '\f0dc';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    margin-left: var(--s-2);
    opacity: .3;
    font-size: .65rem;
}
.data-table td {
    padding: var(--s-3) var(--s-4);
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
}
.data-table tbody tr { transition: background var(--dur-fast) var(--ease); }
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table tbody tr:hover td { color: var(--text); }

.td-date { font-variant-numeric: tabular-nums; font-size: .8rem; }
.td-amount { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.td-amount.positive { color: var(--success); }
.td-amount.negative { color: var(--danger); }
.text-end { text-align: right; }
.text-center { text-align: center; }

.badge {
    display: inline-flex;
    align-items: center;
    gap: var(--s-1);
    padding: 3px 10px;
    border-radius: var(--r-full);
    font-size: .72rem;
    font-weight: 700;
}
.badge-success { background: var(--success-bg); color: #047857; }
.badge-danger { background: var(--danger-bg); color: #b91c1c; }
.badge-warning { background: var(--warning-bg); color: #92400e; }
.badge-primary { background: var(--brand-100); color: var(--brand-700); }
html[data-theme="dark"] .badge-success { background: rgba(16,185,129,.15); color: #34d399; }
html[data-theme="dark"] .badge-danger { background: rgba(239,68,68,.15); color: #f87171; }
html[data-theme="dark"] .badge-warning { background: rgba(245,158,11,.15); color: #fbbf24; }
html[data-theme="dark"] .badge-primary { background: rgba(99,102,241,.15); color: var(--brand-300); }

.cat-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: var(--r-sm);
    font-size: .72rem;
    background: var(--surface-3);
    color: var(--text-muted);
    font-weight: 500;
}

.empty-state {
    padding: var(--s-12) var(--s-4);
    text-align: center;
    color: var(--text-subtle);
}
.empty-state i { font-size: 2rem; margin-bottom: var(--s-3); display: block; opacity: .4; }

.loading-state {
    padding: var(--s-12) var(--s-4);
    text-align: center;
    color: var(--text-subtle);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s-3);
}
.no-data {
    text-align: center;
    padding: var(--s-4);
    color: var(--text-subtle);
    font-style: italic;
    font-size: .85rem;
}

.spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--brand-500);
    border-radius: var(--r-full);
    animation: spin 1s linear infinite;
    margin: var(--s-8) auto;
}
.spinner-border {
    display: inline-block;
    width: 1.1rem; height: 1.1rem;
    border: 2px solid rgba(255,255,255,.35);
    border-right-color: #fff;
    border-radius: var(--r-full);
    animation: spin .8s linear infinite;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Skeleton */
.skeleton {
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--r-sm);
}
.skeleton-row { display: flex; padding: var(--s-3) var(--s-4); gap: var(--s-4); border-bottom: 1px solid var(--border); }
.skeleton-cell { flex: 1; height: 18px; background: var(--surface-3); border-radius: var(--r-xs); }
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ============================================================
   11. BOUTONS
   ============================================================ */
.btn {
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    padding: var(--s-2) var(--s-4);
    border-radius: var(--r-md);
    font-size: .85rem;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
}
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }
.btn-primary {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    box-shadow: 0 4px 12px rgba(79,70,229,.25);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,70,229,.35); }
.btn-accent {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    box-shadow: 0 4px 12px rgba(79,70,229,.25);
}
.btn-accent:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,70,229,.35); }
.btn-ghost {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border-strong); transform: translateY(-1px); }
.btn-success {
    background: linear-gradient(135deg, var(--success), #059669);
    color: #fff;
    box-shadow: 0 4px 12px rgba(16,185,129,.25);
}
.btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,185,129,.35); }
.btn-danger {
    background: linear-gradient(135deg, var(--danger), #b91c1c);
    color: #fff;
}
.btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(239,68,68,.35); }
.btn-warning {
    background: linear-gradient(135deg, var(--warning), #d97706);
    color: #fff;
    box-shadow: 0 4px 12px rgba(245,158,11,.25);
}
.btn-warning:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,158,11,.35); }

/* ============================================================
   12. MODALES
   ============================================================ */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--s-4);
    z-index: 2000;
    animation: fadeIn var(--dur) var(--ease);
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow: hidden;
    box-shadow: var(--sh-xl);
    animation: popIn var(--dur-slow) var(--ease-spring);
    display: flex;
    flex-direction: column;
}
.modal.xlarge { max-width: 900px; }
@media (max-width: 768px) { .modal.xlarge { max-width: 96%; } }
@keyframes popIn {
    from { opacity: 0; transform: translateY(-16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--s-4) var(--s-5);
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, var(--brand-600), var(--violet));
    color: #fff;
    flex-wrap: wrap;
    gap: var(--s-2);
    flex-shrink: 0;
}
.modal-head-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: var(--s-2); }
.modal-close {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    background: rgba(255,255,255,.15);
    color: inherit;
    transition: all var(--dur-fast) var(--ease);
    flex-shrink: 0;
}
.modal-close:hover { background: rgba(255,255,255,.25); transform: rotate(90deg); }
.modal-body { padding: var(--s-5); max-height: 65vh; overflow-y: auto; }
.modal-body.xlarge-body { max-height: 70vh; }
.modal-foot {
    padding: var(--s-4) var(--s-5);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: var(--s-2);
    flex-wrap: wrap;
    align-items: center;
    flex-shrink: 0;
}
@media (max-width: 768px) {
    .modal-foot { flex-direction: column-reverse; }
    .modal-foot .btn { width: 100%; justify-content: center; }
    .modal-foot span[style*="margin-right"] { margin: 0 0 var(--s-2) 0 !important; }
}

/* ============================================================
   13. FORMULAIRES
   ============================================================ */
.form-group { margin-bottom: var(--s-4); }
.form-label {
    display: block;
    margin-bottom: var(--s-2);
    font-weight: 600;
    font-size: .82rem;
    color: var(--text);
}
.form-control {
    width: 100%;
    padding: var(--s-3);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    font-family: inherit;
    font-size: .9rem;
    background: var(--surface);
    transition: all var(--dur-fast) var(--ease);
}
.form-control:focus {
    outline: none;
    border-color: var(--brand-400);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
}
.form-control:invalid { border-color: var(--danger); }
.form-control[readonly] { background: var(--surface-3); cursor: not-allowed; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
.form-hint { font-size: .72rem; color: var(--text-subtle); margin-top: var(--s-1); }

.nouvelle-quantite {
    width: 85px;
    padding: var(--s-2) var(--s-3);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: .85rem;
    text-align: center;
    outline: none;
    transition: all var(--dur-fast) var(--ease);
}
.nouvelle-quantite:focus {
    border-color: var(--brand-400);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
}

/* Product row (transfert) */
.product-row {
    display: flex;
    gap: var(--s-2);
    align-items: flex-end;
    margin-bottom: var(--s-3);
    padding: var(--s-3);
    background: var(--surface-2);
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    transition: all var(--dur) var(--ease);
    flex-wrap: wrap;
}
.product-row:hover { border-color: var(--brand-400); box-shadow: var(--sh-sm); }
.product-row .flex-3 { flex: 3; min-width: 120px; }
.product-row .flex-1 { flex: 1; min-width: 80px; }
.product-row .flex-05 { flex: 0.5; min-width: 40px; }
@media (max-width: 600px) {
    .product-row .flex-3 { flex: 1 1 100%; }
    .product-row .flex-1 { flex: 1 1 45%; }
    .product-row .flex-05 { flex: 1 1 100%; }
    .product-row .flex-05 .btn { width: 100%; }
}

/* ============================================================
   14. TOASTS
   ============================================================ */
.toast-zone, .toast-container {
    position: fixed;
    top: var(--s-4); right: var(--s-4);
    display: flex;
    flex-direction: column;
    gap: var(--s-2);
    z-index: 10000;
    pointer-events: none;
    max-width: 380px;
}
.toast {
    display: flex;
    align-items: flex-start;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--toast-color, var(--brand-500));
    border-radius: var(--r-md);
    box-shadow: var(--sh-lg);
    pointer-events: auto;
    animation: toastIn var(--dur) var(--ease-spring);
    position: relative;
    overflow: hidden;
}
.toast::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    width: 100%;
    background: var(--toast-color, var(--brand-500));
    animation: progress 5s linear forwards;
}
@keyframes toastIn {
    from { opacity: 0; transform: translateX(100%); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes progress { from { width: 100%; } to { width: 0%; } }
.toast-icon {
    width: 32px; height: 32px;
    border-radius: var(--r-full);
    background: color-mix(in srgb, var(--toast-color, var(--brand-500)) 15%, transparent);
    color: var(--toast-color, var(--brand-500));
    display: grid; place-items: center;
    font-size: .85rem;
    flex-shrink: 0;
}
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: .85rem; font-weight: 700; color: var(--text); }
.toast-msg   { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }
.toast-dismiss {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: var(--r-sm);
    color: var(--text-subtle);
    font-size: .7rem;
    transition: all var(--dur-fast) var(--ease);
    background: none;
    border: none;
    cursor: pointer;
}
.toast-dismiss:hover { background: var(--surface-3); color: var(--text); }

.toast.success { --toast-color: var(--success); }
.toast.error { --toast-color: var(--danger); }
.toast.warning { --toast-color: var(--warning); }
.toast.info { --toast-color: var(--info); }

/* ============================================================
   15. ALERT MESSAGES
   ============================================================ */
.alert-message {
    padding: var(--s-3);
    border-radius: var(--r-md);
    margin: var(--s-3) 0;
    display: flex;
    align-items: center;
    gap: var(--s-2);
    font-size: .82rem;
    font-weight: 500;
}
.alert-success { background: var(--success-bg); color: #047857; border-left: 3px solid var(--success); }
.alert-error { background: var(--danger-bg); color: #b91c1c; border-left: 3px solid var(--danger); }
.alert-warning { background: var(--warning-bg); color: #92400e; border-left: 3px solid var(--warning); }
.alert-info { background: var(--brand-50); color: var(--brand-700); border-left: 3px solid var(--brand-500); }
html[data-theme="dark"] .alert-success { background: rgba(16,185,129,.15); color: #34d399; }
html[data-theme="dark"] .alert-error { background: rgba(239,68,68,.15); color: #f87171; }
html[data-theme="dark"] .alert-warning { background: rgba(245,158,11,.15); color: #fbbf24; }
html[data-theme="dark"] .alert-info { background: rgba(99,102,241,.15); color: var(--brand-300); }

/* ============================================================
   16. PROGRESS OVERLAY
   ============================================================ */
.progress-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
}
.progress-overlay.active { display: flex; }
.progress-modal {
    background: var(--surface);
    border-radius: var(--r-2xl);
    padding: var(--s-8);
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: var(--sh-xl);
    animation: popIn var(--dur-slow) var(--ease-spring);
}
.progress-icon { font-size: 2.5rem; margin-bottom: var(--s-4); color: var(--brand-500); }
.progress-text h4 { font-size: 1.1rem; font-weight: 700; margin-bottom: var(--s-1); }
.progress-text p { font-size: .85rem; color: var(--text-muted); margin-bottom: var(--s-2); }
.progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: var(--r-full);
    overflow: hidden;
    margin-top: var(--s-3);
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand-500), var(--violet));
    width: 0%;
    transition: width .3s ease;
}

/* ============================================================
   17. MOBILE NAV / FAB / BACK
   ============================================================ */
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: color-mix(in srgb, var(--surface) 95%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: var(--s-2) var(--s-3) calc(var(--s-2) + env(safe-area-inset-bottom, 0px));
    z-index: 90;
    justify-content: space-around;
    align-items: center;
    overflow-x: auto;
    scrollbar-width: none;
}
.mobile-nav::-webkit-scrollbar { display: none; }
.mob-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: var(--s-2);
    border-radius: var(--r-md);
    color: var(--text-muted);
    font-size: .65rem;
    font-weight: 600;
    flex-shrink: 0;
    min-width: 64px;
    transition: all var(--dur-fast) var(--ease);
    background: none;
    border: none;
    cursor: pointer;
}
.mob-item i { font-size: 1.1rem; }
.mob-item.active { color: var(--brand-600); background: var(--brand-50); }
html[data-theme="dark"] .mob-item.active { background: rgba(99,102,241,.15); color: var(--brand-300); }

.fab {
    display: none;
    position: fixed;
    bottom: 5.5rem;
    right: var(--s-5);
    width: 48px; height: 48px;
    border-radius: var(--r-full);
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    border: none;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    box-shadow: var(--sh-md);
    z-index: 100;
    transition: all var(--dur) var(--ease-spring);
}
.fab:hover { transform: translateY(-2px) scale(1.08); }
.fab.visible { display: flex; }

.back-btn {
    position: fixed;
    bottom: 5.5rem;
    left: var(--s-5);
    z-index: 100;
    display: none;
}
.back-btn .btn {
    width: 48px; height: 48px;
    border-radius: var(--r-full);
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--sh-md);
}
.back-btn .btn span { display: none; }
.back-btn .btn i { margin: 0; font-size: 1.1rem; }

/* ============================================================
   18. RESPONSIVE
   ============================================================ */
@media (max-width: 1024px) {
    .app { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }
    .app .brand-text, .app .nav-label, .app .nav-section-label,
    .app .user-meta, .app .nav-badge { opacity: 0; pointer-events: none; }
    .app .nav-sub { display: none; }
    .search-trigger { min-width: 200px; }
    .search-trigger span { display: none; }
}
@media (max-width: 768px) {
    .app { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
    .sidebar {
        position: fixed;
        top: 0; left: 0;
        width: var(--sidebar-w);
        height: 100vh;
        transform: translateX(-100%);
        transition: transform var(--dur) var(--ease);
        z-index: 100;
        box-shadow: var(--sh-xl);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar .brand-text, .sidebar .nav-label, .sidebar .nav-section-label,
    .sidebar .user-meta, .sidebar .nav-badge { opacity: 1; pointer-events: auto; }
    .sidebar .nav-sub { display: block; }
    .sidebar-backdrop {
        position: fixed; inset: 0;
        background: rgba(15,23,42,.5);
        backdrop-filter: blur(4px);
        z-index: 99;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur) var(--ease);
    }
    .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
    .search-trigger { min-width: auto; padding: var(--s-2) var(--s-3); }
    .search-trigger span, .search-trigger kbd { display: none; }
    .main { padding: var(--s-4); padding-bottom: 90px; }
    .mobile-nav { display: flex; }
    .fab { display: flex; }
    .back-btn { display: block; }
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .page-title { font-size: 1.25rem; }
    .section-title { font-size: 1rem; }
    .section-head { flex-direction: column; align-items: stretch; }
    .section-actions { width: 100%; }
    .section-actions .btn { flex: 1; justify-content: center; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .result-count { margin-left: 0; text-align: right; }
}
@media (max-width: 480px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .kpi-card { padding: var(--s-3); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
    </style>
</head>
<body>

<!-- ===== TOASTS ===== -->
<div class="toast-zone" id="toast-zone"></div>

<!-- ===== FAB / BACK ===== -->
<button class="fab" id="fab" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="fas fa-arrow-up"></i>
</button>
<div class="back-btn">
    <button class="btn btn-ghost" onclick="goBack()" title="Retour">

<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const CONFIG = {
        API_BASE: 'https://script.google.com/macros/s/AKfycby4Fmu83Lmi9waQBLdHU1EEfVgQ14ceefh3PR-j5wQ1zsQ-KN5YYSLAQOy0Jjs1GEZ9/exec',
        SESSION_KEYS: {
            USER: 'utilisateur',
            TOKEN: 'apiToken'
        }
    };

    // ============================================================
    // GESTION DU TOKEN
    // ============================================================
    const TokenManager = {
        getToken() {
            return sessionStorage.getItem(CONFIG.SESSION_KEYS.TOKEN) || localStorage.getItem(CONFIG.SESSION_KEYS.TOKEN);
        },
        getUser() {
            return sessionStorage.getItem(CONFIG.SESSION_KEYS.USER) || localStorage.getItem(CONFIG.SESSION_KEYS.USER) || 'Admin';
        },
        isAuthenticated() {
            const token = this.getToken();
            return token && token !== 'undefined' && token !== 'null';
        },
        redirectToLogin() {
            sessionStorage.removeItem(CONFIG.SESSION_KEYS.TOKEN);
            sessionStorage.removeItem(CONFIG.SESSION_KEYS.USER);
            window.location.href = 'code.html';
        },
        checkAndRedirect() {
            if (!this.isAuthenticated()) {
                this.redirectToLogin();
                return false;
            }
            return true;
        }
    };

    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    const STATE = {
        agencies: [],
        stockData: {},
        currentAgency: null,
        pendingTransferData: null,
        toastId: 0,
        inventaireEnCours: null,
        progressInterval: null
    };

    // ============================================================
    // FONCTIONS UTILITAIRES
    // ============================================================
    const Utils = {
        formatDate: (dateStr) => {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return isNaN(date.getTime()) ? dateStr : date.toLocaleDateString('fr-FR');
            } catch { return dateStr; }
        },
        formatCurrency: (amount) => {
            const val = typeof amount === 'number' ? amount : parseFloat(amount) || 0;
            return val.toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' FCFA';
        },
        escapeHtml: (text) => {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        },
        showToast: (message, type = 'info', duration = 5000) => {
            const container = document.getElementById('toast-zone');
            if (!container) return;
            const id = `toast-${STATE.toastId++}`;
            const toast = document.createElement('div');
            const colors = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
            const icons = { success: 'fa-check', error: 'fa-xmark', warning: 'fa-exclamation', info: 'fa-info' };
            const titles = { success: 'Succès', error: 'Erreur', warning: 'Attention', info: 'Info' };

            toast.className = `toast ${type}`;
            toast.id = id;
            toast.style.setProperty('--toast-color', colors[type] || colors.info);
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></div>
                <div class="toast-body">
                    <div class="toast-title">${titles[type] || 'Info'}</div>
                    <div class="toast-msg">${Utils.escapeHtml(message)}</div>
                </div>
                <button class="toast-dismiss" onclick="closeToast('${id}')"><i class="fas fa-xmark"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => closeToast(id), duration);
            return id;
        },
        showProgress: (message = 'Traitement en cours...', subMessage = '') => {
            const overlay = document.createElement('div');
            overlay.className = 'progress-overlay active';
            overlay.id = 'global-progress-overlay';
            overlay.innerHTML = `
                <div class="progress-modal">
                    <div class="progress-icon"><i class="fas fa-spinner fa-spin"></i></div>
                    <div class="progress-text">
                        <h4>${message}</h4>
                        ${subMessage ? `<p>${subMessage}</p>` : ''}
                        <div class="progress-bar"><div class="progress-fill"></div></div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            const fill = overlay.querySelector('.progress-fill');
            let width = 0;
            const interval = setInterval(() => {
                if (width < 80) { width += 5; fill.style.width = width + '%'; }
            }, 200);
            overlay.dataset.interval = interval;
        },
        hideProgress: (success = true, message = '') => {
            const overlay = document.getElementById('global-progress-overlay');
            if (!overlay) return;
            clearInterval(overlay.dataset.interval);
            const fill = overlay.querySelector('.progress-fill');
            if (fill) fill.style.width = '100%';
            const content = overlay.querySelector('.progress-text');
            const icon = success ? 'check-circle' : 'exclamation-circle';
            const color = success ? 'var(--success)' : 'var(--danger)';
            const title = success ? 'Succès !' : 'Erreur';
            const defaultMsg = success ? 'Opération terminée avec succès' : 'Une erreur est survenue';
            content.innerHTML = `
                <div class="progress-icon" style="color:${color}"><i class="fas fa-${icon}"></i></div>
                <h4>${title}</h4>
                <p>${message || defaultMsg}</p>
            `;
            setTimeout(() => overlay.remove(), 2000);
        },
        closeModal: () => {
            document.getElementById('modal-container').innerHTML = '';
            document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        },
        showInlineMessage: (elementId, msg, type, duration = 3000) => {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.textContent = msg;
            el.className = `alert-message alert-${type}`;
            el.style.display = 'flex';
            clearTimeout(el._hideTimeout);
            el._hideTimeout = setTimeout(() => { el.style.display = 'none'; }, duration);
        }
    };

    // ============================================================
    // API
    // ============================================================
    const API = {
        async get(action, params = {}) {
            if (!TokenManager.checkAndRedirect()) return;
            const token = TokenManager.getToken();
            const url = new URL(CONFIG.API_BASE);
            url.searchParams.append('action', action);
            url.searchParams.append('token', token);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
                const data = await response.json();

                if (data.success === false) {
                    if (data.message === 'Session expirée' || data.message === 'Session invalide' || data.message === 'Token invalide') {
                        TokenManager.redirectToLogin();
                        throw new Error(data.message);
                    }
                }
                return data;
            } catch (error) {
                console.error('Erreur API GET:', error);
                throw error;
            }
        },
        async post(action, data = {}) {
            if (!TokenManager.checkAndRedirect()) return;
            const token = TokenManager.getToken();
            const url = `${CONFIG.API_BASE}?action=${action}`;
            const bodyData = {
                ...data,
                token: token,
                utilisateur: TokenManager.getUser(),
                timestamp: new Date().toISOString()
            };

            await fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });

            return { success: true, message: 'Requête envoyée' };
        }
    };

    // ============================================================
    // GESTION DES TOASTS
    // ============================================================
    function closeToast(id) {
        const toast = document.getElementById(id);
        if (toast) {
            toast.style.animation = 'toastIn 0.3s ease-out reverse';
            setTimeout(() => toast.remove(), 300);
        }
    }

    // ============================================================
    // GESTION DE LA DATE
    // ============================================================
    function updateCurrentDate() {
        const el = document.getElementById('current-date');
        if (!el) return;
        const now = new Date();
        el.textContent = now.toLocaleDateString('fr-FR', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function goBack() {
        window.location.href = 'Accueil.html';
    }

    function handleScroll() {
        const fab = document.getElementById('fab');
        if (fab) {
            fab.classList.toggle('visible', window.scrollY > 300);
        }
    }

    // ============================================================
    // NAVIGATION SIDEBAR (sous-menus)
    // ============================================================
    function toggleNavSub(el) {
        const isOpen = el.classList.contains('open');
        document.querySelectorAll('.nav-item.open').forEach(i => i.classList.remove('open'));
        if (!isOpen) el.classList.add('open');
    }

    // ============================================================
    // THEME / SIDEBAR / LOGOUT
    // ============================================================
    function initTheme() {
        const saved = localStorage.getItem('visiopro-theme') || 'auto';
        applyTheme(saved);
        const tt = document.getElementById('themeToggle');
        if (tt && !tt.dataset.bound) {
            tt.dataset.bound = '1';
            tt.addEventListener('click', () => {
                const cur = document.documentElement.getAttribute('data-theme') || 'light';
                const next = cur === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                localStorage.setItem('visiopro-theme', next);
            });
        }
    }
    function applyTheme(theme) {
        if (theme === 'auto') {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        const icon = document.querySelector('#themeToggle i');
        if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }

    function initSidebar() {
        const app = document.getElementById('app');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        const btnMenu = document.getElementById('btnMenu');
        if (!app || !sidebar || !btnMenu) return;
        btnMenu.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
                backdrop?.classList.toggle('open');
            } else {
                app.classList.toggle('sidebar-collapsed');
                localStorage.setItem('visiopro-sidebar-collapsed', app.classList.contains('sidebar-collapsed'));
            }
        });
        backdrop?.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); });
        if (localStorage.getItem('visiopro-sidebar-collapsed') === 'true' && window.innerWidth > 768) {
            app.classList.add('sidebar-collapsed');
        }
    }

    function handleLogout() {
        sessionStorage.clear();
        localStorage.removeItem("utilisateur");
        localStorage.removeItem("token");
        localStorage.removeItem("apiToken");
        window.location.href = "code.html";
    }

    // ============================================================
    // CHARGEMENT DES AGENCES
    // ============================================================
    async function loadAgencies() {
        if (!TokenManager.checkAndRedirect()) return;

        try {
            const json = await API.get('getdataagence');
            if (!json.success || !json.data?.caisses?.length) throw new Error('Réponse invalide');

            STATE.agencies = json.data.caisses.map(c => ({
                value: (c.value || '').toString().toLowerCase().replace(/\s+/g, '-'),
                label: c.label || c.value || '',
                stockRoute: (c.identifiant || '').toString().toLowerCase()
            })).filter(a => a.value);

            STATE.agencies.forEach(({ value }) => {
                STATE.stockData[value] = { allData: [], filteredData: [] };
            });

            buildUI();
            if (STATE.agencies.length > 0) {
                STATE.currentAgency = STATE.agencies[0].value;
                showSection(STATE.currentAgency);
                loadAgenceStock(STATE.currentAgency);
            }
        } catch (err) {
            console.error('Erreur chargement agences:', err);
            document.getElementById('content-area').innerHTML = `
                <div class="empty-state" style="padding:3rem 1rem;">
                    <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
                    <p>Impossible de charger les agences. ${err.message}</p>
                    <button class="btn btn-primary" onclick="loadAgencies()" style="margin-top:.5rem;">Réessayer</button>
                </div>`;
        }
    }

    // ============================================================
    // CONSTRUCTION DE L'INTERFACE
    // ============================================================
    function buildUI() {
        buildSidebarStock();
        buildMobileNav();
        buildSections();
    }

    /* Construit la liste dynamique des agences dans la sidebar (section Stock) */
    function buildSidebarStock() {
        const container = document.getElementById('stock-submenu-inner');
        if (!container) return;

        if (!STATE.agencies || STATE.agencies.length === 0) {
            container.innerHTML = `<a href="#" style="color:var(--text-subtle);font-size:.78rem;pointer-events:none;">
                <i class="fas fa-ban"></i> Aucune agence
            </a>`;
            return;
        }

        container.innerHTML = STATE.agencies.map(c => `
            <a href="#"
               class="stock-nav-link"
               data-agence-id="${c.value}"
               onclick="selectStockAgencyFromSidebar('${c.value}', event); return false;">
                <i class="fas fa-warehouse"></i>
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    ${Utils.escapeHtml(c.label)}
                </span>
            </a>
        `).join('');

        updateSidebarActiveStock();
    }

    /* Met en évidence l'agence actuellement sélectionnée dans la sidebar */
    function updateSidebarActiveStock() {
        document.querySelectorAll('.stock-nav-link').forEach(link => {
            const isActive = link.dataset.agenceId === STATE.currentAgency;
            link.style.background = isActive ? 'var(--brand-50)' : '';
            link.style.color = isActive ? 'var(--brand-700)' : '';
            link.style.fontWeight = isActive ? '700' : '500';
        });

        // Badge sur le nav-item parent
        const navItem = document.querySelector('.nav-item[data-nav="stock"]');
        if (navItem) {
            navItem.querySelector('.nav-badge')?.remove();
            const agency = STATE.agencies.find(a => a.value === STATE.currentAgency);
            if (agency) {
                const badge = document.createElement('span');
                badge.className = 'nav-badge';
                badge.style.background = 'var(--brand-500)';
                badge.style.maxWidth = '70px';
                badge.style.overflow = 'hidden';
                badge.style.textOverflow = 'ellipsis';
                badge.style.whiteSpace = 'nowrap';
                badge.textContent = agency.label;
                const chevron = navItem.querySelector('.fa-chevron-down');
                if (chevron) navItem.insertBefore(badge, chevron);
                else navItem.appendChild(badge);
            }
        }
    }

    /* Appelée quand on clique sur une agence dans la sidebar */
    function selectStockAgencyFromSidebar(agenceId, event) {
        if (event) event.stopPropagation();

        const agency = STATE.agencies.find(a => a.value === agenceId);
        if (!agency) return;

        showSection(agenceId);
        updateSidebarActiveStock();

        // Ferme la sidebar mobile
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        sidebar?.classList.remove('open');
        backdrop?.classList.remove('open');

        Utils.showToast(`Agence « ${agency.label} » sélectionnée`, 'success', 2000);
    }

    function buildMobileNav() {
        const mobileNav = document.getElementById('mobile-nav');
        if (!mobileNav) return;
        mobileNav.innerHTML = STATE.agencies.map(({ value, label }, i) => `
            <button class="mob-item ${i === 0 ? 'active' : ''}" onclick="showSection('${value}')" data-agence="${value}">
                <i class="fas fa-warehouse"></i>
                <span>${label.length > 12 ? label.substring(0,10)+'..' : label}</span>
            </button>
        `).join('');
    }

    function buildSections() {
        document.getElementById('content-area').innerHTML = STATE.agencies.map(({ value, label }, i) => `
            <div id="section-${value}" class="section ${i === 0 ? 'active' : ''}">
                <div class="section-head">
                    <div class="section-actions">
                        <button class="btn btn-primary" onclick="demarrerInventaire('${value}')">
                            <i class="fas fa-clipboard-list"></i> Inventaire
                        </button>
                        <button class="btn btn-warning" onclick="openTransferWizard('${value}')">
                            <i class="fas fa-exchange-alt"></i> Transférer
                        </button>
                        <button class="btn btn-ghost" onclick="refreshStockData('${value}')">
                            <i class="fas fa-sync-alt"></i> Actualiser
                        </button>
                    </div>
                </div>

                <!-- KPI Cards -->
                <div class="kpi-grid" id="kpi-grid-${value}"></div>

                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" class="search-input" id="search-${value}" placeholder="Rechercher référence..." onkeyup="applyStockFilter('${value}')">
                    </div>
                    <div class="filters-row">
                        <div class="filter-chip" id="chip-${value}-category" onclick="toggleCategoryFilter('${value}')">
                            <span class="chip-label">Catégorie</span>
                            <span class="chip-val" id="chip-${value}-category-val">Tous</span>
                            <span class="chip-caret"><i class="fas fa-chevron-down"></i></span>
                            <div class="chip-drop" id="chip-${value}-category-drop"></div>
                        </div>
                        <span class="result-count" id="result-count-${value}">0 résultat(s)</span>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-card">
                    <div class="table-scroll">
                        <div id="skeleton-${value}" class="skeleton" style="display:none;">
                            <div class="skeleton-row"><div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div></div>
                            <div class="skeleton-row"><div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div></div>
                            <div class="skeleton-row"><div class="skeleton-cell"></div><div class="skeleton-cell"></div><div class="skeleton-cell"></div></div>
                        </div>
                        <table class="data-table" id="stock-table-${value}">
                            <thead id="stock-header-${value}"></thead>
                            <tbody id="stock-data-${value}">
                                <tr><td colspan="12"><div class="loading-state"><div class="spinner"></div>Chargement...</div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `).join('');

        STATE.agencies.forEach(({ value }) => {
            initCategoryFilter(value);
        });
    }

    // ============================================================
    // GESTION DES FILTRES CATÉGORIE
    // ============================================================
    function toggleCategoryFilter(agenceId) {
        const drop = document.getElementById(`chip-${agenceId}-category-drop`);
        if (drop) {

            </div>

                <div class="drop-item" data-value="${Utils.escapeHtml(c)}" onclick="selectCategoryFilter('${agenceId}','${Utils.escapeHtml(c)}','${Utils.escapeHtml(c)}')">

                </div>

    function selectCategoryFilter(agenceId, value, label) {
        const valEl = document.getElementById(`chip-${agenceId}-category-val`);
        if (valEl) {
            valEl.textContent = label || 'Tous';
            valEl.style.display = value && value !== '' ? 'inline' : 'none';
        }
        const drop = document.getElementById(`chip-${agenceId}-category-drop`);
        if (drop) {
            drop.querySelectorAll('.drop-item').forEach(item => {
                item.classList.toggle('sel', item.dataset.value === value);
            });
            drop.style.display = 'none';

        if (!STATE.stockData[agenceId]) STATE.stockData[agenceId] = { allData: [], filteredData: [] };

    // ============================================================
    // CHARGEMENT DU STOCK
    // ============================================================
    async function loadAgenceStock(agenceId) {
        if (!TokenManager.checkAndRedirect()) return;

        const agency = STATE.agencies.find(a => a.value === agenceId);
        if (!agency) return;

        const tbody = document.getElementById(`stock-data-${agenceId}`);
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="12"><div class="loading-state"><div class="spinner"></div>Chargement...</div></td></tr>`;
        }

        if (!agency.stockRoute) {
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="12"><div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i><p>Aucune route de stock configurée pour cette agence</p></div></td></tr>`;
            }
            return;
        }

        try {
            const json = await API.get(agency.stockRoute);

            if (!json?.data?.rows || !json?.data?.headers) throw new Error('Structure de données invalide');

            STATE.stockData[agenceId].allData = json.data.rows.map(row => {
                const item = {};
                json.data.headers.forEach((h, i) => {
                    const key = h.trim();
                    let val = row[i] ?? '';
                    if (['Stock', 'Prix', 'Conso', 'Stock de depart', 'Stock Physique', 'Stock depart'].some(k => key.includes(k))) {
                        val = parseFloat(val) || 0;
                    }
                    item[key] = val;
                });
                item['Agence'] = agency.label;
                return item;
            });

            STATE.stockData[agenceId].filteredData = [];
            STATE.stockData[agenceId].selectedCategory = '';
            generateTableHeaders(agenceId);
            initCategoryFilter(agenceId);
            updateSummaryCards(agenceId);
            displayStockData(agenceId);
            Utils.showToast(`${STATE.stockData[agenceId].allData.length} produits chargés`, 'success', 2000);
        } catch (err) {
            console.error(`Erreur ${agenceId}:`, err);
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="12"><div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i><p>Erreur: ${err.message}</p></div></td></tr>`;
            }
        }
    }

    function generateTableHeaders(agenceId) {
        const data = STATE.stockData[agenceId]?.allData || [];
        const thead = document.getElementById(`stock-header-${agenceId}`);
        if (!data[0] || !thead) return;
        const headers = Object.keys(data[0]).filter(h => h !== 'User' && h !== 'Agence');
        thead.innerHTML = '<tr>' + headers.map(h => {
            const cls = (h.includes('Prix') || h.includes('Stock') || h.includes('Conso')) ? 'text-end' : '';
            return `<th class="sortable ${cls}" onclick="sortTable('${agenceId}','${h}')">${Utils.escapeHtml(h)}</th>`;
        }).join('') + '</tr>';
    }

    function sortTable(agenceId, column) {
        const data = [...(STATE.stockData[agenceId].filteredData.length ? STATE.stockData[agenceId].filteredData : STATE.stockData[agenceId].allData)];
        data.sort((a, b) => {
            let va = a[column], vb = b[column];
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return -1;
            if (va > vb) return 1;
            return 0;
        });
        STATE.stockData[agenceId].filteredData = data;
        displayStockData(agenceId);
    }

    // ============================================================
    // AFFICHAGE DU STOCK PAR CATÉGORIE (DYNAMIQUE)
    // ============================================================
    function updateCategoryStockCards(agenceId) {
        const data = STATE.stockData[agenceId]?.allData || [];
        const grid = document.getElementById(`kpi-grid-${agenceId}`);
        if (!grid) return;

        const categoryData = {};
        data.forEach(item => {
            const cat = item['Catégorie'] || 'Non catégorisé';
            const stockPhysique = parseFloat(item['Stock Physique']) || parseFloat(item['Stock']) || 0;
            const stockDepart = parseFloat(item['Stock de depart']) || parseFloat(item['Stock depart']) || 0;

            if (!categoryData[cat]) {
                categoryData[cat] = { stockPhysique: 0, stockDepart: 0 };
            }
            categoryData[cat].stockPhysique += stockPhysique;
            categoryData[cat].stockDepart += stockDepart;
        });

        const sortedCategories = Object.entries(categoryData)
            .sort((a, b) => b[1].stockPhysique - a[1].stockPhysique);

        if (sortedCategories.length === 0) {
            grid.innerHTML = `
                <div class="kpi-card" style="grid-column:1 / -1;text-align:center;padding:1.5rem;">
                    <div class="kpi-label" style="justify-content:center;">
                        <span class="kpi-icon" style="background:var(--text-subtle);color:#fff;"><i class="fas fa-info-circle"></i></span>
                        Aucune catégorie
                    </div>
                    <div class="kpi-value" style="font-size:.9rem;color:var(--text-subtle);">Aucun stock disponible</div>
                </div>
            `;
            return;
        }

        const colors = [
            { bg: 'var(--brand-50)', color: 'var(--brand-600)' },
            { bg: 'var(--success-bg)', color: 'var(--success)' },
            { bg: 'var(--warning-bg)', color: 'var(--warning)' },
            { bg: 'var(--danger-bg)', color: 'var(--danger)' },
            { bg: 'var(--info-bg)', color: 'var(--info)' },
            { bg: '#E8F0FE', color: '#1A73E8' },
            { bg: '#FCE4EC', color: '#C62828' },
            { bg: '#E8F5E9', color: '#2E7D32' },
        ];

        grid.innerHTML = sortedCategories.map(([category, data], index) => {
            const color = colors[index % colors.length];
            const { stockPhysique, stockDepart } = data;

            const percentage = stockDepart > 0 ? ((stockPhysique / stockDepart) * 100) : 0;
            const percentageDisplay = percentage.toFixed(1);

            let statusColor = color.color;
            let statusIcon = 'fa-check-circle';
            let statusText = 'Bon';
            if (percentage < 50) {
                statusColor = 'var(--danger)';
                statusIcon = 'fa-exclamation-triangle';
                statusText = 'Critique';
            } else if (percentage < 80) {
                statusColor = 'var(--warning)';
                statusIcon = 'fa-clock';
                statusText = 'Moyen';
            }

            return `
                <div class="kpi-card" style="position:relative;overflow:hidden;">
                    <div style="position:absolute;top:0;right:0;bottom:0;width:4px;background:${statusColor};border-radius:0 4px 4px 0;"></div>
                    <div class="kpi-label">
                        <span class="kpi-icon" style="background:${color.bg};color:${color.color};"><i class="fas fa-tag"></i></span>
                        ${Utils.escapeHtml(category)}
                        <span style="margin-left:auto;font-size:.65rem;color:${statusColor};font-weight:700;">${percentageDisplay}%</span>
                    </div>
                    <div class="kpi-value" style="color:${color.color};">${stockPhysique}</div>
                    <div class="kpi-unit">
                        <span style="color:var(--text-muted);">Stock physique</span>
                        <span style="color:var(--text-subtle);margin-left:.5rem;">(départ: ${stockDepart})</span>
                    </div>
                    <div style="margin-top:.5rem;height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
                        <div style="height:100%;width:${Math.min(percentage, 100)}%;background:${statusColor};border-radius:2px;transition:width .6s ease;"></div>
                    </div>
                    <div style="margin-top:.4rem;display:flex;align-items:center;gap:.3rem;font-size:.65rem;color:${statusColor};">
                        <i class="fas ${statusIcon}"></i>
                        <span>${statusText}</span>
                        <span style="margin-left:auto;color:var(--text-subtle);font-size:.6rem;">${percentageDisplay}% du stock initial</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateSummaryCards(agenceId) {
        updateCategoryStockCards(agenceId);
    }

    function displayStockData(agenceId) {
        const data = STATE.stockData[agenceId]?.filteredData?.length ? STATE.stockData[agenceId].filteredData : STATE.stockData[agenceId]?.allData || [];
        const tbody = document.getElementById(`stock-data-${agenceId}`);
        if (!tbody) return;

        if (!data.length) {
            tbody.innerHTML = `<tr><td colspan="12"><div class="empty-state"><i class="fas fa-inbox"></i>Aucun produit trouvé</div></td></tr>`;
            return;
        }

        const headers = Object.keys(data[0] || {}).filter(h => h !== 'User' && h !== 'Agence');
        tbody.innerHTML = data.map((item, index) => `
            <tr style="animation:fadeUp .2s ${index * 0.02}s both;">
                ${headers.map(h => {
                    let v = item[h] ?? '';
                    if (h === 'Date' || h.includes('Date')) v = Utils.formatDate(v);
                    if (h.includes('Prix')) v = Utils.formatCurrency(v);
                    if (typeof v === 'number') v = v.toString();
                    const cls = (h.includes('Prix') || h.includes('Stock') || h.includes('Conso')) ? 'td-amount' : '';
                    return `<td class="${cls}">${Utils.escapeHtml(v)}</td>`;
                }).join('')}
            </tr>
        `).join('');

        const countEl = document.getElementById(`result-count-${agenceId}`);
        if (countEl) {
            countEl.textContent = `${data.length} résultat${data.length > 1 ? 's' : ''}`;
        }
    }

    function applyStockFilter(agenceId) {
        const term = (document.getElementById(`search-${agenceId}`)?.value || '').toLowerCase().trim();
        const cat = STATE.stockData[agenceId]?.selectedCategory || '';

        let filtered = [...(STATE.stockData[agenceId]?.allData || [])];
        if (term) {
            filtered = filtered.filter(d => {
                const ref = (d['Référence'] || '').toString().toLowerCase();
                const desc = (d['Désignation'] || '').toString().toLowerCase();
                return ref.includes(term) || desc.includes(term);
            });
        }
        if (cat) {
            filtered = filtered.filter(d => d['Catégorie'] === cat);
        }
        STATE.stockData[agenceId].filteredData = filtered;
        displayStockData(agenceId);
    }

        STATE.stockData[agenceId] = { allData: [], filteredData: [], selectedCategory: '' };
        loadAgenceStock(agenceId);

        if (!TokenManager.checkAndRedirect()) return;

        const btn = document.getElementById('btnVerifierCode');
        const agenceId = document.getElementById('agenceInventaire')?.value;
        const agency = STATE.agencies.find(a => a.value === agenceId);
        const agenceNom = agency?.label || '';

        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }
        try {
            await API.get('accesinventaire', { agence: agenceNom });
            Utils.showInlineMessage('codeMessage', '✅ Nouveau code envoyé par email', 'success');
        } catch {
            Utils.showInlineMessage('codeMessage', '❌ Erreur', 'error');
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Vérifier';

    async function verifierCodeAcces() {
        if (!TokenManager.checkAndRedirect()) return;

        const code = document.getElementById('codeInput')?.value.trim();
        const agenceId = document.getElementById('agenceInventaire')?.value;
        const categorie = document.getElementById('categorieInventaire')?.value || '';
        if (!code || code.length !== 6) {
            Utils.showInlineMessage('codeMessage', '❌ Code à 6 chiffres requis', 'error');
            return;
        }
        const btn = document.getElementById('btnVerifierCode');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        try {
            const result = await API.get('codeaccess', { code: code });
            if (!result || result.success !== true) {
                throw new Error(result?.message || 'Code incorrect');
            }
            Utils.showInlineMessage('codeMessage', '✅ Code vérifié !', 'success');
            setTimeout(() => {
                Utils.closeModal();
                openInventaireSearchModal(agenceId, categorie);
            }, 800);
        } catch (err) {
            Utils.showInlineMessage('codeMessage', '❌ ' + (err.message || 'Code incorrect'), 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Vérifier';
        }
    }
